# 9.6. MODFLOW 6 Configuration
# ================================================================================
# MODFLOW 6 is the USGS modular groundwater flow model. In SYMFLUENCE it is used
# as a lumped single-cell groundwater model coupled with land surface models
# (e.g., SUMMA) to produce physically-based baseflow separation.
#
# Coupling workflow: SUMMA recharge → MODFLOW baseflow → mizuRoute routing
#
# Reference: Langevin et al. (2017), USGS Techniques and Methods 6-A55
# https://github.com/MODFLOW-ORG/modflow6

# MODFLOW_INSTALL_PATH
#   Type:        str
#   Default:     default
#   Source:      MODFLOWConfig (model_configs.py)
MODFLOW_INSTALL_PATH: default

# MODFLOW_EXE
#   Type:        str
#   Default:     mf6
#   Source:      MODFLOWConfig (model_configs.py)
MODFLOW_EXE: "mf6"

# SETTINGS_MODFLOW_PATH
#   Type:        str
#   Default:     default
#   Source:      MODFLOWConfig (model_configs.py)
SETTINGS_MODFLOW_PATH: default

# MODFLOW_SPATIAL_MODE
#   Type:        str
#   Default:     lumped
#   Source:      MODFLOWConfig (model_configs.py)
MODFLOW_SPATIAL_MODE: lumped

# MODFLOW_GRID_TYPE
#   Type:        str (dis/disv/disu)
#   Default:     dis
#   Source:      MODFLOWConfig (model_configs.py)
#   Note:        Only 'dis' (structured grid) is currently supported for lumped mode
MODFLOW_GRID_TYPE: dis

# MODFLOW_NLAY — Number of model layers
#   Type:        int
#   Default:     1
#   Source:      MODFLOWConfig (model_configs.py)
MODFLOW_NLAY: 1

# MODFLOW_NROW — Number of rows
#   Type:        int
#   Default:     1
#   Source:      MODFLOWConfig (model_configs.py)
MODFLOW_NROW: 1

# MODFLOW_NCOL — Number of columns
#   Type:        int
#   Default:     1
#   Source:      MODFLOWConfig (model_configs.py)
MODFLOW_NCOL: 1

# MODFLOW_CELL_SIZE — Cell dimension in meters
#   Type:        float
#   Default:     1000.0
#   Source:      MODFLOWConfig (model_configs.py)
#   Note:        For lumped mode, defaults to sqrt(catchment_area_m2)
MODFLOW_CELL_SIZE: 1000.0

# MODFLOW_K — Hydraulic conductivity (m/d)
#   Type:        float
#   Default:     5.0
#   Source:      MODFLOWConfig (model_configs.py)
#   Range:       Typically 0.001–100 depending on geology
MODFLOW_K: 5.0

# MODFLOW_SY — Specific yield (dimensionless)
#   Type:        float
#   Default:     0.15
#   Source:      MODFLOWConfig (model_configs.py)
#   Range:       0.01–0.40 (sand ≈0.25, clay ≈0.03, gravel ≈0.22)
MODFLOW_SY: 0.15

# MODFLOW_SS — Specific storage (1/m)
#   Type:        float
#   Default:     1e-5
#   Source:      MODFLOWConfig (model_configs.py)
MODFLOW_SS: 1.0e-5

# MODFLOW_STRT — Starting head (m)
#   Type:        float
#   Default:     None (computed as midpoint of top and bot)
#   Source:      MODFLOWConfig (model_configs.py)
MODFLOW_STRT: null

# MODFLOW_TOP — Aquifer top elevation (m)
#   Type:        float
#   Default:     1500.0
#   Source:      MODFLOWConfig (model_configs.py)
MODFLOW_TOP: 1500.0

# MODFLOW_BOT — Aquifer bottom elevation (m)
#   Type:        float
#   Default:     1400.0
#   Source:      MODFLOWConfig (model_configs.py)
MODFLOW_BOT: 1400.0

# MODFLOW_COUPLING_SOURCE — Land surface model providing recharge
#   Type:        str
#   Default:     SUMMA
#   Source:      MODFLOWConfig (model_configs.py)
#   Options:     SUMMA, CLM, or None for standalone
MODFLOW_COUPLING_SOURCE: SUMMA

# MODFLOW_RECHARGE_VARIABLE — Variable name in coupling source output
#   Type:        str
#   Default:     scalarSoilDrainage
#   Source:      MODFLOWConfig (model_configs.py)
MODFLOW_RECHARGE_VARIABLE: scalarSoilDrainage

# MODFLOW_DRAIN_ELEVATION — Drain package outlet elevation (m)
#   Type:        float
#   Default:     None (computed as midpoint of top and bot)
#   Source:      MODFLOWConfig (model_configs.py)
#   Note:        Must be between bot and top
MODFLOW_DRAIN_ELEVATION: null

# MODFLOW_DRAIN_CONDUCTANCE — Drain conductance (m2/d)
#   Type:        float
#   Default:     50.0
#   Source:      MODFLOWConfig (model_configs.py)
#   Range:       1–1000 depending on geology and outlet geometry
MODFLOW_DRAIN_CONDUCTANCE: 50.0

# MODFLOW_STRESS_PERIOD_LENGTH — Stress period length in days
#   Type:        float
#   Default:     1.0
