#
#  Configuration Hierarchy:
#    Level 1: Top-level sections (system, domain, forcing, model, etc.)
#    Level 2: Logical grouping (e.g., SUMMA-specific, optimization methods)
#    Level 3: Individual parameters with type hints, ranges, and usage counts
#
#  Usage:
#    1. Copy this template to your own config file
#    2. Uncomment the sections you need
#    3. Update values according to your setup
#    4. Refer to docstrings for parameter descriptions
