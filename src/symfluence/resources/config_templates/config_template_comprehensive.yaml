# 9.7. ParFlow Configuration
# ================================================================================
# ParFlow is a parallel integrated hydrologic model solving variably-saturated
# flow (Richards equation) and overland flow. In SYMFLUENCE it is used as an
# alternative to MODFLOW for coupled land surface + groundwater simulations.
#
# Coupling workflow: SUMMA recharge -> ParFlow subsurface flow -> routing
#
# Reference: Kollet & Maxwell (2006), Advances in Water Resources 29(7)
# https://github.com/parflow/parflow

# PARFLOW_INSTALL_PATH — Path to ParFlow installation directory
#   Type:        str
#   Default:     default
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_INSTALL_PATH: default

# PARFLOW_EXE — ParFlow executable name
#   Type:        str
#   Default:     parflow
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_EXE: "parflow"

# PARFLOW_DIR — ParFlow working directory
#   Type:        str
#   Default:     default
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_DIR: default

# SETTINGS_PARFLOW_PATH — Path to ParFlow settings/input files
#   Type:        str
#   Default:     default
#   Source:      ParFlowConfig (model_configs.py)
SETTINGS_PARFLOW_PATH: default

# PARFLOW_SPATIAL_MODE — Spatial discretization mode (lumped or distributed)
#   Type:        str
#   Default:     lumped
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_SPATIAL_MODE: lumped

# PARFLOW_NX — Number of grid cells in X direction
#   Type:        int
#   Default:     1
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_NX: 1

# PARFLOW_NY — Number of grid cells in Y direction
#   Type:        int
#   Default:     1
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_NY: 1

# PARFLOW_NZ — Number of grid cells in Z direction (vertical layers)
#   Type:        int
#   Default:     1
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_NZ: 1

# PARFLOW_DX — Grid cell size in X direction (meters)
#   Type:        float
#   Default:     1000.0
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_DX: 1000.0

# PARFLOW_DY — Grid cell size in Y direction (meters)
#   Type:        float
#   Default:     1000.0
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_DY: 1000.0

# PARFLOW_DZ — Grid cell size in Z direction (meters)
#   Type:        float
#   Default:     100.0
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_DZ: 100.0

# PARFLOW_TOP — Domain surface elevation (meters)
#   Type:        float
#   Default:     1500.0
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_TOP: 1500.0

# PARFLOW_BOT — Domain bottom elevation (meters)
#   Type:        float
#   Default:     1400.0
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_BOT: 1400.0

# PARFLOW_K_SAT — Saturated hydraulic conductivity (m/hr)
#   Type:        float
#   Default:     5.0
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_K_SAT: 5.0

# PARFLOW_POROSITY — Soil porosity (fraction 0-1)
#   Type:        float
#   Default:     0.4
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_POROSITY: 0.4

# PARFLOW_VG_ALPHA — Van Genuchten alpha parameter (1/m)
#   Type:        float
#   Default:     1.0
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_VG_ALPHA: 1.0

# PARFLOW_VG_N — Van Genuchten n parameter (must be > 1.0)
#   Type:        float
#   Default:     2.0
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_VG_N: 2.0

# PARFLOW_S_RES — Residual saturation (fraction 0-1)
#   Type:        float
#   Default:     0.1
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_S_RES: 0.1

# PARFLOW_S_SAT — Saturated saturation (fraction 0-1)
#   Type:        float
#   Default:     1.0
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_S_SAT: 1.0

# PARFLOW_SS — Specific storage (1/m)
#   Type:        float
#   Default:     1.0e-5
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_SS: 1.0e-5

# PARFLOW_MANNINGS_N — Manning's roughness coefficient for overland flow
#   Type:        float
#   Default:     0.03
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_MANNINGS_N: 0.03

# PARFLOW_INITIAL_PRESSURE — Initial pressure head (meters); null for hydrostatic
#   Type:        Optional[float]
#   Default:     null
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_INITIAL_PRESSURE: null

# PARFLOW_COUPLING_SOURCE — Model providing recharge to ParFlow
#   Type:        str
#   Default:     SUMMA
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_COUPLING_SOURCE: SUMMA

# PARFLOW_RECHARGE_VARIABLE — Variable name for recharge coupling
#   Type:        str
#   Default:     scalarSoilDrainage
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_RECHARGE_VARIABLE: scalarSoilDrainage

# PARFLOW_SOLVER — ParFlow solver type (Richards or Impes)
#   Type:        str
#   Default:     Richards
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_SOLVER: Richards

# PARFLOW_TIMESTEP_HOURS — Simulation timestep in hours
#   Type:        float
#   Default:     1.0
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_TIMESTEP_HOURS: 1.0

# PARFLOW_NUM_PROCS — Number of parallel processes for ParFlow
#   Type:        int
#   Default:     1
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_NUM_PROCS: 1

# EXPERIMENT_OUTPUT_PARFLOW — ParFlow output directory path
#   Type:        str
#   Default:     default
#   Source:      ParFlowConfig (model_configs.py)
EXPERIMENT_OUTPUT_PARFLOW: default

# PARFLOW_PARAMS_TO_CALIBRATE — Comma-separated list of parameters to calibrate
#   Type:        str
#   Default:     K_SAT,POROSITY,VG_ALPHA,VG_N,MANNINGS_N
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_PARAMS_TO_CALIBRATE: "K_SAT,POROSITY,VG_ALPHA,VG_N,MANNINGS_N"

# PARFLOW_TIMEOUT — Execution timeout in seconds
#   Type:        int
#   Default:     3600
#   Source:      ParFlowConfig (model_configs.py)
PARFLOW_TIMEOUT: 3600

# PARFLOW_PARAM_BOUNDS
#   Type:        Optional
