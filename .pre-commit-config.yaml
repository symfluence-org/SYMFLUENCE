# Pre-commit hooks for SYMFLUENCE
# Install: pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  python: python3

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Upstream-source patches and vendored model inputs must stay byte-exact
      - id: trailing-whitespace
        exclude: ^(docs/|examples/.*\.ipynb$|src/symfluence/models/[^/]+/patches/.*\.patch$|src/symfluence/models/clmparflow/basin/templates/)
      - id: end-of-file-fixer
        exclude: ^(docs/|examples/.*\.ipynb$|src/symfluence/models/[^/]+/patches/.*\.patch$|src/symfluence/models/clmparflow/basin/templates/)
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-case-conflict

  # Ruff - fast Python linter and formatter (matches pyproject.toml config)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        exclude: ^paper/
      # Formatter (optional - uncomment to enable auto-formatting)
      # - id: ruff-format
      #   types_or: [python, pyi]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, --quiet]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|paper/)

  # Jupyter notebook cleanup (clear outputs before commit)
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: ^examples/

  # Mypy type checking — rev and pandas-stubs pin must match the CI mypy
  # step in .github/workflows/ci.yml (same toolchain in both gates, or casts
  # valid under one stub version fail the other). Bump both together.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        # numpy<2.4: newer numpy stubs use py3.12 `type` statements, which
        # mypy rejects under the project's python_version = 3.11 config
        # (CI's py3.11 lint job resolves numpy 2.3.x for the same reason).
        additional_dependencies: [types-PyYAML, types-requests, types-psutil, pandas-stubs==3.0.3.260530, numpy<2.4]
        exclude: ^(tests/|examples/|paper/|src/symfluence/cli\.py$)

  # Project-specific CI guards (match .github/workflows/ci.yml)
  - repo: local
    hooks:
      - id: actionlint
        name: Validate GitHub Actions workflows
        entry: python scripts/run_actionlint.py
        language: python
        additional_dependencies: [actionlint-py==1.7.12.24]
        pass_filenames: false
        files: ^(\.github/workflows/.*\.ya?ml|scripts/run_actionlint\.py)$
      - id: check-npm-bin-shebangs
        name: Guard npm bin wrapper shebangs
        entry: python scripts/check_npm_bin_shebangs.py
        language: python
        pass_filenames: false
        files: ^npm/bin/
      - id: check-broad-exceptions
        name: Guard broad Exception catches
        entry: python scripts/check_broad_exceptions.py
        language: python
        pass_filenames: false
        types: [python]
      - id: check-resilience-logging
        name: Guard resilience handlers log with a traceback
        entry: python scripts/check_resilience_logging.py
        language: python
        pass_filenames: false
        types: [python]
      - id: check-model-raises
        name: Guard generic raises in models/
        entry: python scripts/check_model_raises.py
        language: python
        pass_filenames: false
        types: [python]
      - id: check-version-sync
        name: Validate version synchronization
        entry: bash scripts/check_version_sync.sh
        language: system
        pass_filenames: false
        files: (symfluence_version\.py|pyproject\.toml|setup\.cfg)
      - id: check-manifest-consistency
        name: Guard install-manifest consistency
        entry: python scripts/check_manifest_consistency.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        files: (pyproject\.toml|pixi\.toml|environment\.yml)
      - id: check-core-layering
        name: Guard core layering (no core -> upper-layer imports)
        entry: python scripts/check_core_layering.py
        language: python
        pass_filenames: false
        types: [python]
        files: ^src/symfluence/core/
      - id: check-shipped-configs-strict
        name: Guard shipped configs validate under strict mode
        entry: python scripts/check_shipped_configs_strict.py
        language: system  # needs the installed symfluence package (registry/config), not an isolated env
        pass_filenames: false
        files: ^(src/symfluence/resources/config_templates/|examples/.*\.ya?ml$|scripts/check_shipped_configs_strict\.py$)
