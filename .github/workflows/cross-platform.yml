name: Cross-Platform Testing

on:
  # Tiered: the full OS matrix runs after merge to develop/main, nightly, and on
  # demand — NOT on every PR. The fast unit gate lives in ci.yml, which also
  # carries a lean windows-latest unit leg (uv, no conda/GDAL) so that
  # platform-conditional Python fails a PR check rather than surfacing here
  # after merge — the gap that left develop red on a POSIX-only signal.SIGKILL.
  # What remains exclusive to this workflow is the fidelity that leg drops:
  # macOS, GDAL via conda, binary validation, and integration tests.
  push:
    branches: [ main, develop ]
  schedule:
    - cron: '0 3 * * *'  # nightly full cross-platform matrix
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: cross-platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # MATRIX TEST: Unit tests across all OS/Python combinations
  # ===========================================================================
  unit-tests-matrix:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # 30 rather than 20, matching ci.yml. Note the reason is NOT that the suite is
    # slow: measured over 29 runs it completes in 9m24s-12m21s, a tight cluster
    # that never came close to 20 minutes.
    #
    # The timeout kills this job has had were `apt-get` hanging in "Install
    # minimal system dependencies" — see that step. Raising the ceiling was
    # therefore never the fix, and the earlier version of this comment (which
    # blamed a slow suite) was wrong: one kill happened at 30 minutes, after the
    # raise. The ceiling stays at 30 as ordinary headroom for the ~12-minute
    # worst case plus installation; the hang is bounded at the step instead.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # Linux, macOS, Windows
        python-version: ['3.11']  # Focus on latest stable and supported version

    steps:
      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        if: matrix.os != 'windows-latest'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Setup conda (Windows)
        if: matrix.os == 'windows-latest'
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          python-version: ${{ matrix.python-version }}
          auto-activate-base: true
          activate-environment: "test-env"
          miniconda-version: "latest"
          channels: conda-forge,defaults

      - name: Pin netCDF4 for the conda env (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # conda's GDAL brings HDF5 1.14.6 into this env. pip wheels that bundle
        # a different HDF5 fail to load once a process has the conda one:
        # netCDF4 1.7.5 (HDF5 2.2.0, "DLL load failed while importing
        # _netCDF4") and h5py 3.16 (HDF5 2.0.0, "procedure could not be found",
        # order-dependent under xdist). netCDF4 1.7.4 and h5py 3.15 bundle
        # 1.14.6. PIP_CONSTRAINT reaches every later pip call, including the
        # bootstrap's. Lift with the matching caps in install-validate-arm.yml.
        run: |
          printf '%s\n' 'netCDF4<1.7.5' 'h5py<3.16' > "$RUNNER_TEMP/windows-conda-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/windows-conda-constraints.txt" >> "$GITHUB_ENV"

      - name: Compute apt cache key
        id: aptkey
        if: matrix.os == 'ubuntu-24.04'
        # ImageOS/ImageVersion are runner shell variables, not part of the
        # workflow `env` context, so ${{ env.ImageVersion }} is empty.
        run: echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore cached apt packages
        if: matrix.os == 'ubuntu-24.04'
        # As in ci.yml: a crawling mirror (~80 kB/s on run 40232275315) cannot
        # deliver the download however the step is retried, so keep the .debs in
        # actions/cache, keyed on the runner image whose package versions they
        # must match. A new image falls back to the previous cache.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-debs
          key: apt-debs-v1-${{ runner.os }}-minimal-gdal-cdo-${{ steps.aptkey.outputs.image }}
          restore-keys: |
            apt-debs-v1-${{ runner.os }}-minimal-gdal-cdo-

      - name: Install minimal system dependencies
        shell: bash
        # See the matching step in ci.yml for the full account: three of this
        # job's timeout kills were `apt-get` stalling here, not a slow test suite
        # — zero pytest output in the logs, and one died at the 30-minute ceiling.
        # apt has no default download timeout; the drop-in bounds and retries each
        # connection, and the step timeout attributes any remaining stall to this
        # step rather than to the tests. Normal completion is 1-2 minutes.
        #
        # Acquire::Retries only retries downloads within a single apt run, so a
        # run that wedges as a whole still burns the budget; the outer loop gets
        # a fresh run (usually a different mirror), with each attempt capped by
        # `timeout` so one stall cannot eat every attempt. --no-install-recommends
        # keeps the download small enough to finish on a degraded mirror (with
        # recommends it was 249 MB, and runs 31111560519 / 31113143558 crawled at
        # ~240 kB/s), and the 8m cap covers a slow-but-progressing fetch rather
        # than just a healthy one. Kept in step with the matching step in ci.yml.
        timeout-minutes: 22
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-24.04" ]]; then
            printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
              | sudo tee /etc/apt/apt.conf.d/99symfluence-timeouts > /dev/null
            # Seed apt from the cached .debs (see "Restore cached apt packages").
            if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then
              echo "Seeding $(ls "$HOME"/apt-debs/*.deb | wc -l) cached .debs"
              sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/
            fi
            for attempt in 1 2; do
              if timeout 2m sudo apt-get update \
                 && timeout 8m sudo apt-get install -y --no-install-recommends \
                      gdal-bin libgdal-dev cdo; then
                break
              fi
              if [[ "${attempt}" == "2" ]]; then
                echo "::error::apt-get failed after 2 attempts"
                exit 1
              fi
              echo "::warning::apt attempt ${attempt}/2 failed or stalled; retrying"
              # See ci.yml: a cap that fires mid-`Setting up` wedges dpkg, and
              # every later apt call then aborts instantly until it is
              # reconfigured. Resumable, so the retry picks up where this left off.
              timeout 3m sudo dpkg --configure -a || true
              # Deliberately NOT `apt-get clean` — see ci.yml: it deletes the
              # partial downloads, forcing the retry to re-fetch 249 MB from zero.
              sleep 15
            done
            # Refresh the cache dir (saved at job end on a key miss).
            mkdir -p "$HOME/apt-debs"
            rm -f "$HOME"/apt-debs/*.deb
            cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/" 2>/dev/null || true
          elif [[ "${{ matrix.os }}" == "macos-"* ]]; then
            brew install gdal cdo
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows: GDAL from conda-forge
            source "$CONDA/etc/profile.d/conda.sh"
            conda activate test-env
            echo "Installing GDAL via conda on Windows..."
            conda install -c conda-forge gdal -y
          fi

      - name: Install Python dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            source "$CONDA/etc/profile.d/conda.sh"
            conda activate test-env
            conda install pip -y
          fi
          python -m pip install --upgrade pip

          # Install GDAL Python bindings
          # Note: Skip gdal-config on Windows — conda's gdal-config is not bash-compatible
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows: Use GDAL from conda (already installed in previous step)
            # Remove GDAL from pyproject.toml to prevent pip from trying to build it from source
            python -c "import re; c=open('pyproject.toml').read(); c=re.sub(r'\"[Gg][Dd][Aa][Ll]\",?\s*','',c); open('pyproject.toml','w').write(c); print('Removed GDAL from pyproject.toml')"
          elif command -v gdal-config >/dev/null 2>&1; then
            GDAL_VERSION=$(gdal-config --version)
            pip install "gdal>=${GDAL_VERSION},<${GDAL_VERSION%.*}.$((${GDAL_VERSION##*.}+1))"
          fi

          # Install CPU-only torch on Linux/Windows to save space
          if [[ "${{ matrix.os }}" != "macos-"* ]]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi

          # Install package from pyproject.toml (source of truth for dependencies).
          pip install -e ".[test,gui]"

          # Install pytest-xdist for parallel test execution
          pip install pytest-xdist

      - name: Run unit tests
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            source "$CONDA/etc/profile.d/conda.sh"
            conda activate test-env
          fi
          # Run tests in parallel with pytest-xdist for 2-3x speedup.
          # tests/conformance/ carries the decomposition proofs (models-absent,
          # contract extraction-readiness) and must run on every platform for
          # the same reason as ci.yml — see the note there.
          pytest --timeout=300 -v --tb=short -m "unit" -n auto --cov --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=25 tests/unit/ tests/conformance/

      - name: Core coverage gate
        # Single shared definition (scope, omits, threshold rationale) lives in
        # scripts/check_core_coverage.py — never inline this command; the
        # duplicated copies in ci.yml and cross-platform.yml once drifted.
        if: matrix.os == 'ubuntu-24.04'
        run: python scripts/check_core_coverage.py

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-24.04' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Smoke-test install-sysdeps --dry-run
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            source "$CONDA/etc/profile.d/conda.sh"
            conda activate test-env
          fi
          # Validate that platform detection and install-command generation work
          python -c "
          from symfluence.cli.services.system_deps import SystemDepsRegistry, Platform
          r = SystemDepsRegistry()
          print(f'Platform: {r.platform.value}')
          assert r.platform != Platform.UNKNOWN, 'Platform should not be UNKNOWN in CI'
          script = r.generate_install_script(tool_name='summa')
          if script:
              print('--- Generated install script ---')
              print(script[:500])
          else:
              print('All deps found — no install script needed')
          print('install-sysdeps dry-run: OK')
          "

  # ===========================================================================
  # BINARY VALIDATION: Test external tools on each platform
  # ===========================================================================
  binary-validation-matrix:
    name: Binary Validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # Linux, macOS, Windows
        include:
          - os: ubuntu-24.04
            python-version: '3.11'
          - os: macos-latest  # ARM Mac (M1/M2)
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.11'

    env:
      SYMFLUENCE_CODE: ${{ github.workspace }}
      SYMFLUENCE_DATA: ${{ github.workspace }}/symfluence_data

    steps:
      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compute apt cache key
        id: aptkey
        if: runner.os == 'Linux'
        # ImageOS/ImageVersion are runner shell variables, not part of the
        # workflow `env` context, so ${{ env.ImageVersion }} is empty.
        run: echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore cached apt packages
        if: runner.os == 'Linux'
        # As in ci.yml: a crawling mirror (~80 kB/s on run 40232275315) cannot
        # deliver the download however the step is retried, so keep the .debs in
        # actions/cache, keyed on the runner image whose package versions they
        # must match. A new image falls back to the previous cache.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-debs
          key: apt-debs-v1-${{ runner.os }}-full-toolchain-${{ steps.aptkey.outputs.image }}
          restore-keys: |
            apt-debs-v1-${{ runner.os }}-full-toolchain-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Seed apt from the cached .debs (see "Restore cached apt packages").
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then
            echo "Seeding $(ls "$HOME"/apt-debs/*.deb | wc -l) cached .debs"
            sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/
          fi
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran cmake \
            openmpi-bin libopenmpi-dev \
            gdal-bin libgdal-dev \
            libnetcdf-dev libnetcdff-dev \
            libhdf5-dev libudunits2-dev \
            libexpat1-dev cdo \
            libopenblas-dev liblapack-dev \
            libproj-dev libgeos-dev
          # Refresh the cache dir (saved at job end on a key miss).
          mkdir -p "$HOME/apt-debs"
          rm -f "$HOME"/apt-debs/*.deb
          cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/" 2>/dev/null || true

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc cmake open-mpi netcdf netcdf-fortran hdf5 gdal udunits cdo

          # Homebrew's gcc ships only versioned binaries (gfortran-NN), but many
          # build scripts invoke `gfortran` by name. Resolve the newest version,
          # retry once if the formula didn't link cleanly (a flaky-runner cause
          # of "gfortran: command not found"), and fail loudly rather than
          # silently leaving FC unset (the previous `if [ -n ... ]` guard turned a
          # missing compiler into a confusing downstream build failure).
          GCC_VER=$(ls /opt/homebrew/bin/gfortran-* 2>/dev/null | sort -V | tail -1 | sed 's/.*gfortran-//')
          if [ -z "$GCC_VER" ]; then
            echo "gfortran not found after 'brew install gcc'; reinstalling gcc..."
            brew reinstall gcc || true
            GCC_VER=$(ls /opt/homebrew/bin/gfortran-* 2>/dev/null | sort -V | tail -1 | sed 's/.*gfortran-//')
          fi
          if [ -z "$GCC_VER" ]; then
            echo "::error::Homebrew gcc did not provide gfortran; cannot build Fortran tools"
            exit 1
          fi
          # Unversioned symlink so name-based `gfortran` invocations resolve.
          ln -sf "/opt/homebrew/bin/gfortran-${GCC_VER}" /opt/homebrew/bin/gfortran
          echo "FC=/opt/homebrew/bin/gfortran-${GCC_VER}" >> $GITHUB_ENV
          echo "CC=/opt/homebrew/bin/gcc-${GCC_VER}" >> $GITHUB_ENV
          echo "CXX=/opt/homebrew/bin/g++-${GCC_VER}" >> $GITHUB_ENV
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

          # Help CMake find Homebrew packages (especially udunits)
          echo "CMAKE_PREFIX_PATH=/opt/homebrew" >> $GITHUB_ENV
          echo "UDUNITS2_ROOT=/opt/homebrew" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - name: Setup conda (Windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          python-version: ${{ matrix.python-version }}
          auto-activate-base: true
          activate-environment: "test-env"
          miniconda-version: "latest"
          channels: conda-forge,defaults

      - name: Pin netCDF4 for the conda env (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # conda's GDAL brings HDF5 1.14.6 into this env. pip wheels that bundle
        # a different HDF5 fail to load once a process has the conda one:
        # netCDF4 1.7.5 (HDF5 2.2.0, "DLL load failed while importing
        # _netCDF4") and h5py 3.16 (HDF5 2.0.0, "procedure could not be found",
        # order-dependent under xdist). netCDF4 1.7.4 and h5py 3.15 bundle
        # 1.14.6. PIP_CONSTRAINT reaches every later pip call, including the
        # bootstrap's. Lift with the matching caps in install-validate-arm.yml.
        run: |
          printf '%s\n' 'netCDF4<1.7.5' 'h5py<3.16' > "$RUNNER_TEMP/windows-conda-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/windows-conda-constraints.txt" >> "$GITHUB_ENV"

      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          # Remove unnecessary packages to free up disk space
          # Note: Do NOT remove $AGENT_TOOLSDIRECTORY - it contains setup-python installation
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Cache external tools
        id: cache-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.SYMFLUENCE_DATA }}/installs
          key: symfluence-tools-${{ runner.os }}-${{ runner.arch }}-v5

      - name: Pre-install Python package (needed for build script)
        if: steps.cache-tools.outputs.cache-hit != 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Install package first so CLI is available for build script
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source "$CONDA/etc/profile.d/conda.sh"
            conda activate test-env
            conda install pip -y
          fi
          python -m pip install --upgrade pip
          pip install rich pyyaml

          # Install GDAL Python bindings BEFORE package install (needed for osgeo imports)
          # Note: Check Windows first — conda's gdal-config is not bash-compatible
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python -c "import re; c=open('pyproject.toml').read(); c=re.sub(r'\"gdal[^\"]*\",?\s*','',c,flags=re.I); open('pyproject.toml','w').write(c)"
          elif command -v gdal-config >/dev/null 2>&1; then
            GDAL_VERSION=$(gdal-config --version)
            pip install "gdal>=${GDAL_VERSION},<${GDAL_VERSION%.*}.$((${GDAL_VERSION##*.}+1))"
          fi

          pip install -e . || pip install .
          git checkout pyproject.toml 2>/dev/null || true
          echo "Package pre-installed for build script"

      - name: Build external tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Initialize conda for bash on Windows
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source "$CONDA/etc/profile.d/conda.sh"
            conda activate test-env
            export PATH="$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/condabin:$PATH"
            # Windows: use conda Python directly, no venv
            export SYMFLUENCE_NO_VENV="true"
            export SYMFLUENCE_PYTHON="python"
          else
            # Linux/macOS: use setup-python's Python location
            if [[ -n "${pythonLocation:-}" ]]; then
              export PATH="${pythonLocation}:${pythonLocation}/bin:$PATH"
              # Find Python executable - check bin/ and root directory
              if [[ -x "${pythonLocation}/bin/python3" ]]; then
                export SYMFLUENCE_PYTHON="${pythonLocation}/bin/python3"
              elif [[ -x "${pythonLocation}/bin/python" ]]; then
                export SYMFLUENCE_PYTHON="${pythonLocation}/bin/python"
              elif [[ -x "${pythonLocation}/python3" ]]; then
                export SYMFLUENCE_PYTHON="${pythonLocation}/python3"
              elif [[ -x "${pythonLocation}/python" ]]; then
                export SYMFLUENCE_PYTHON="${pythonLocation}/python"
              else
                export SYMFLUENCE_PYTHON="python3"
              fi
            else
              export SYMFLUENCE_PYTHON="python3"
            fi
            echo "Using Python: $SYMFLUENCE_PYTHON ($($SYMFLUENCE_PYTHON --version))"
          fi
          mkdir -p "${{ env.SYMFLUENCE_DATA }}"
          chmod +x ./scripts/symfluence-bootstrap || true  # chmod may not work on Windows
          ./scripts/symfluence-bootstrap --install

      - name: Add tools to PATH
        shell: bash
        run: |
          echo "${{ env.SYMFLUENCE_DATA }}/installs/summa/bin" >> $GITHUB_PATH
          echo "${{ env.SYMFLUENCE_DATA }}/installs/mizuRoute/route/bin" >> $GITHUB_PATH
          if [[ -d "${{ env.SYMFLUENCE_DATA }}/installs/TauDEM/bin" ]]; then
            echo "${{ env.SYMFLUENCE_DATA }}/installs/TauDEM/bin" >> $GITHUB_PATH
          fi

      - name: Install Python dependencies
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source "$CONDA/etc/profile.d/conda.sh"
            conda activate test-env
            conda install pip -y
          fi
          python -m pip install --upgrade pip

          # Install GDAL Python bindings matching system version
          # Note: Check Windows first — conda's gdal-config is not bash-compatible
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            conda install -c conda-forge gdal -y
          elif command -v gdal-config >/dev/null 2>&1; then
            GDAL_VERSION=$(gdal-config --version)
            pip install "gdal>=${GDAL_VERSION},<${GDAL_VERSION%.*}.$((${GDAL_VERSION##*.}+1))"
          fi

          # Install package from pyproject.toml (source of truth for dependencies)
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # On Windows, GDAL is from conda. Remove it from pyproject.toml before install
            # Surgically drop only the "gdal" dependency token so the TOML
            # stays valid (a line-filter corrupts it, yielding a 0.0.0 install
            # with no dependencies). Mirrors the unit-test job.
            python -c "import re; c=open('pyproject.toml').read(); c=re.sub(r'\"[Gg][Dd][Aa][Ll][^\"]*\",?\s*','',c); open('pyproject.toml','w').write(c); print('Removed GDAL from pyproject.toml')"
            pip install -e ".[test]"
          else
            pip install -e ".[test]"
          fi

      - name: Validate binaries
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source "$CONDA/etc/profile.d/conda.sh"
            conda activate test-env
          fi
          pytest --timeout=300 -v --tb=short -s tests/e2e/test_install_validate.py::test_binary_validation

      # =====================================================================
      # PHASE 1: Generate Release Artifacts (macOS only)
      # =====================================================================
      - name: Generate toolchain metadata
        if: success() && runner.os == 'macOS'
        run: |
          set -e
          chmod +x ./scripts/generate_toolchain.sh
          ./scripts/generate_toolchain.sh \
            "${{ env.SYMFLUENCE_DATA }}/installs" \
            "${{ env.SYMFLUENCE_DATA }}/installs/toolchain.json" \
            "macos-arm64"

      - name: Stage release artifacts
        if: success() && runner.os == 'macOS'
        run: |
          set -e
          chmod +x ./scripts/stage_release_artifacts.sh
          mkdir -p ./release
          ./scripts/stage_release_artifacts.sh \
            "macos-arm64" \
            "${{ env.SYMFLUENCE_DATA }}/installs" \
            "./release"

      - name: Verify binary portability
        if: success() && runner.os == 'macOS'
        run: |
          set -e
          chmod +x ./scripts/verify_binary_portability.sh
          ./scripts/verify_binary_portability.sh \
            "./release/symfluence-tools/bin" || {
            echo "⚠️  Portability verification had warnings but continuing..."
            echo "   Review the output above for potential issues"
          }

      - name: Create release tarball
        if: success() && runner.os == 'macOS'
        run: |
          set -e
          chmod +x ./scripts/create_release_tarball.sh
          VERSION="${{ github.ref_name }}"
          ./scripts/create_release_tarball.sh \
            "$VERSION" \
            "macos-arm64" \
            "./release/symfluence-tools" \
            "./release"

      - name: Test artifact relocatability
        if: success() && runner.os == 'macOS'
        run: |
          set -e
          echo "Testing relocated binaries..."

          # Extract to temporary location
          mkdir -p /tmp/symfluence-test
          cd /tmp/symfluence-test
          tar -xzf $GITHUB_WORKSPACE/release/symfluence-tools-*.tar.gz

          # A relocated binary is broken if it cannot resolve its shared
          # libraries. Detect that explicitly — loader errors are printed even
          # when the tool's own exit code for --version/--help is non-zero —
          # instead of swallowing the result with `|| echo`, which hid genuine
          # relocation failures (the whole point of this test).
          check_relocated() {
            local name="$1" bin="$2"; shift 2
            if [ ! -f "$bin" ]; then
              echo "  (skipping $name — not present in this build)"
              return 0
            fi
            local out
            out="$("$bin" "$@" 2>&1 | head -20 || true)"
            echo "$out"
            if echo "$out" | grep -qiE "dyld|library not loaded|image not found|error while loading shared|cannot open shared object|symbol not found"; then
              echo "::error::$name failed to load shared libraries after relocation"
              return 1
            fi
            if [ -z "$out" ]; then
              echo "::error::$name produced no output after relocation (likely failed to start)"
              return 1
            fi
            echo "  ✓ $name runs after relocation"
          }

          # Test binaries run without their original install directory
          echo "→ Testing SUMMA...";  check_relocated SUMMA ./symfluence-tools/bin/summa --version
          echo "→ Testing NGEN...";   check_relocated NGEN  ./symfluence-tools/bin/ngen --help

          echo "→ Testing mizuRoute..."
          if [ -f "./symfluence-tools/bin/mizuroute" ]; then
            [ -x "./symfluence-tools/bin/mizuroute" ] || { echo "::error::mizuRoute is not executable"; exit 1; }
            echo "  ✓ mizuRoute is executable"
          fi

          echo "✓ Relocatability test complete"

      - name: Upload release artifacts
        if: success() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symfluence-tools-macos-arm64
          path: |
            release/symfluence-tools-*.tar.gz
            release/symfluence-tools-*.sha256
          retention-days: 30

  # ===========================================================================
  # INTEGRATION: Quick integration tests (Linux + macOS + Windows)
  # ===========================================================================
  integration-tests-matrix:
    name: Integration Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          # Test on Linux with multiple Python versions
          - os: ubuntu-24.04
            python-version: '3.11'
          # Test on macOS with latest Python
          - os: macos-latest  # ARM Mac (M1/M2)
            python-version: '3.11'
          # Test on Windows with latest Python
          - os: windows-latest
            python-version: '3.11'

    env:
      SYMFLUENCE_CODE: ${{ github.workspace }}
      SYMFLUENCE_DATA: ${{ github.workspace }}/symfluence_data

    steps:
      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        if: matrix.os != 'windows-latest'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compute apt cache key
        id: aptkey
        if: matrix.os == 'ubuntu-24.04'
        # ImageOS/ImageVersion are runner shell variables, not part of the
        # workflow `env` context, so ${{ env.ImageVersion }} is empty.
        run: echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore cached apt packages
        if: matrix.os == 'ubuntu-24.04'
        # As in ci.yml: a crawling mirror (~80 kB/s on run 40232275315) cannot
        # deliver the download however the step is retried, so keep the .debs in
        # actions/cache, keyed on the runner image whose package versions they
        # must match. A new image falls back to the previous cache.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-debs
          key: apt-debs-v1-${{ runner.os }}-full-toolchain-${{ steps.aptkey.outputs.image }}
          restore-keys: |
            apt-debs-v1-${{ runner.os }}-full-toolchain-

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # Seed apt from the cached .debs (see "Restore cached apt packages").
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then
            echo "Seeding $(ls "$HOME"/apt-debs/*.deb | wc -l) cached .debs"
            sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/
          fi
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran cmake \
            openmpi-bin libopenmpi-dev \
            gdal-bin libgdal-dev \
            libnetcdf-dev libnetcdff-dev \
            libhdf5-dev libudunits2-dev \
            libexpat1-dev cdo \
            libopenblas-dev liblapack-dev \
            libproj-dev libgeos-dev
          # Refresh the cache dir (saved at job end on a key miss).
          mkdir -p "$HOME/apt-debs"
          rm -f "$HOME"/apt-debs/*.deb
          cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/" 2>/dev/null || true

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc cmake open-mpi netcdf netcdf-fortran hdf5 gdal udunits cdo

          # Homebrew's gcc ships only versioned binaries (gfortran-NN), but many
          # build scripts invoke `gfortran` by name. Resolve the newest version,
          # retry once if the formula didn't link cleanly (a flaky-runner cause
          # of "gfortran: command not found"), and fail loudly rather than
          # silently leaving FC unset (the previous `if [ -n ... ]` guard turned a
          # missing compiler into a confusing downstream build failure).
          GCC_VER=$(ls /opt/homebrew/bin/gfortran-* 2>/dev/null | sort -V | tail -1 | sed 's/.*gfortran-//')
          if [ -z "$GCC_VER" ]; then
            echo "gfortran not found after 'brew install gcc'; reinstalling gcc..."
            brew reinstall gcc || true
            GCC_VER=$(ls /opt/homebrew/bin/gfortran-* 2>/dev/null | sort -V | tail -1 | sed 's/.*gfortran-//')
          fi
          if [ -z "$GCC_VER" ]; then
            echo "::error::Homebrew gcc did not provide gfortran; cannot build Fortran tools"
            exit 1
          fi
          # Unversioned symlink so name-based `gfortran` invocations resolve.
          ln -sf "/opt/homebrew/bin/gfortran-${GCC_VER}" /opt/homebrew/bin/gfortran
          echo "FC=/opt/homebrew/bin/gfortran-${GCC_VER}" >> $GITHUB_ENV
          echo "CC=/opt/homebrew/bin/gcc-${GCC_VER}" >> $GITHUB_ENV
          echo "CXX=/opt/homebrew/bin/g++-${GCC_VER}" >> $GITHUB_ENV
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

          # Help CMake find Homebrew packages (especially udunits)
          echo "CMAKE_PREFIX_PATH=/opt/homebrew" >> $GITHUB_ENV
          echo "UDUNITS2_ROOT=/opt/homebrew" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - name: Setup conda (Windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          python-version: ${{ matrix.python-version }}
          auto-activate-base: true
          activate-environment: "test-env"
          miniconda-version: "latest"
          channels: conda-forge,defaults

      - name: Pin netCDF4 for the conda env (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # conda's GDAL brings HDF5 1.14.6 into this env. pip wheels that bundle
        # a different HDF5 fail to load once a process has the conda one:
        # netCDF4 1.7.5 (HDF5 2.2.0, "DLL load failed while importing
        # _netCDF4") and h5py 3.16 (HDF5 2.0.0, "procedure could not be found",
        # order-dependent under xdist). netCDF4 1.7.4 and h5py 3.15 bundle
        # 1.14.6. PIP_CONSTRAINT reaches every later pip call, including the
        # bootstrap's. Lift with the matching caps in install-validate-arm.yml.
        run: |
          printf '%s\n' 'netCDF4<1.7.5' 'h5py<3.16' > "$RUNNER_TEMP/windows-conda-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/windows-conda-constraints.txt" >> "$GITHUB_ENV"

      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          # Remove unnecessary packages to free up disk space
          # Note: Do NOT remove $AGENT_TOOLSDIRECTORY - it contains setup-python installation
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Cache external tools
        id: cache-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.SYMFLUENCE_DATA }}/installs
          key: symfluence-tools-${{ runner.os }}-${{ runner.arch }}-v5

      - name: Cache raw forcing data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.SYMFLUENCE_DATA }}/cache/raw_forcing
          key: raw-forcing-v1-${{ hashFiles('tests/configs/*.yaml', 'tests/integration/data/*.py') }}
          restore-keys: |
            raw-forcing-v1-

      - name: Pre-install Python package (needed for build script)
        if: steps.cache-tools.outputs.cache-hit != 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Install package first so CLI is available for build script
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source "$CONDA/etc/profile.d/conda.sh"
            conda activate test-env
            conda install pip -y
          fi
          python -m pip install --upgrade pip
          pip install rich pyyaml

          # Install GDAL Python bindings BEFORE package install (needed for osgeo imports)
          # Note: Check Windows first — conda's gdal-config is not bash-compatible
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python -c "import re; c=open('pyproject.toml').read(); c=re.sub(r'\"gdal[^\"]*\",?\s*','',c,flags=re.I); open('pyproject.toml','w').write(c)"
          elif command -v gdal-config >/dev/null 2>&1; then
            GDAL_VERSION=$(gdal-config --version)
            pip install "gdal>=${GDAL_VERSION},<${GDAL_VERSION%.*}.$((${GDAL_VERSION##*.}+1))"
          fi

          pip install -e . || pip install .
          git checkout pyproject.toml 2>/dev/null || true
          echo "Package pre-installed for build script"

      - name: Build external tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Initialize conda for bash on Windows
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source "$CONDA/etc/profile.d/conda.sh"
            conda activate test-env
            export PATH="$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/condabin:$PATH"
            # Windows: use conda Python directly, no venv
            export SYMFLUENCE_NO_VENV="true"
            export SYMFLUENCE_PYTHON="python"
          else
            # Linux/macOS: use setup-python's Python location
            if [[ -n "${pythonLocation:-}" ]]; then
              export PATH="${pythonLocation}:${pythonLocation}/bin:$PATH"
              # Find Python executable - check bin/ and root directory
              if [[ -x "${pythonLocation}/bin/python3" ]]; then
                export SYMFLUENCE_PYTHON="${pythonLocation}/bin/python3"
              elif [[ -x "${pythonLocation}/bin/python" ]]; then
                export SYMFLUENCE_PYTHON="${pythonLocation}/bin/python"
              elif [[ -x "${pythonLocation}/python3" ]]; then
                export SYMFLUENCE_PYTHON="${pythonLocation}/python3"
              elif [[ -x "${pythonLocation}/python" ]]; then
                export SYMFLUENCE_PYTHON="${pythonLocation}/python"
              else
                export SYMFLUENCE_PYTHON="python3"
              fi
            else
              export SYMFLUENCE_PYTHON="python3"
            fi
            echo "Using Python: $SYMFLUENCE_PYTHON ($($SYMFLUENCE_PYTHON --version))"
          fi
          mkdir -p "${{ env.SYMFLUENCE_DATA }}"
          chmod +x ./scripts/symfluence-bootstrap || true  # chmod may not work on Windows
          ./scripts/symfluence-bootstrap --install

      - name: Add tools to PATH
        shell: bash
        run: |
          echo "${{ env.SYMFLUENCE_DATA }}/installs/summa/bin" >> $GITHUB_PATH
          echo "${{ env.SYMFLUENCE_DATA }}/installs/mizuRoute/route/bin" >> $GITHUB_PATH
          if [[ -d "${{ env.SYMFLUENCE_DATA }}/installs/TauDEM/bin" ]]; then
            echo "${{ env.SYMFLUENCE_DATA }}/installs/TauDEM/bin" >> $GITHUB_PATH
          fi

      - name: Install Python dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            source "$CONDA/etc/profile.d/conda.sh"
            conda activate test-env
            conda install pip -y
          fi
          python -m pip install --upgrade pip

          # Install GDAL Python bindings matching system version
          # Note: Check Windows first — conda's gdal-config is not bash-compatible
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            conda install -c conda-forge gdal -y
          elif command -v gdal-config >/dev/null 2>&1; then
            GDAL_VERSION=$(gdal-config --version)
            pip install "gdal>=${GDAL_VERSION},<${GDAL_VERSION%.*}.$((${GDAL_VERSION##*.}+1))"
          fi

          # Install package from pyproject.toml (source of truth for dependencies)
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Surgically drop only the "gdal" dependency token so the TOML
            # stays valid (a line-filter corrupts it, yielding a 0.0.0 install
            # with no dependencies). Mirrors the unit-test job.
            python -c "import re; c=open('pyproject.toml').read(); c=re.sub(r'\"[Gg][Dd][Aa][Ll][^\"]*\",?\s*','',c); open('pyproject.toml','w').write(c); print('Removed GDAL from pyproject.toml')"
            pip install -e ".[test]"
          else
            pip install -e ".[test]"
          fi
          # Install pytest-xdist for parallel execution
          pip install pytest-xdist

      - name: Run integration tests
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            source "$CONDA/etc/profile.d/conda.sh"
            conda activate test-env
          fi
          # Run integration tests in parallel (skip slow tests that download large datasets)
          pytest --timeout=300 -v --tb=short -m "integration and not slow" -n auto tests/integration/

      - name: Upload test outputs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-outputs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ env.SYMFLUENCE_DATA }}/*/simulations/
            ${{ env.SYMFLUENCE_DATA }}/*/settings/
          if-no-files-found: ignore

  # ===========================================================================
  # SUMMARY: Report overall status
  # ===========================================================================
  cross-platform-summary:
    name: Cross-Platform Test Summary
    needs: [unit-tests-matrix, binary-validation-matrix, integration-tests-matrix]
    runs-on: ubuntu-24.04
    if: always()

    steps:
      # A whole-workflow cancellation is not a test result.
      #
      # `concurrency.cancel-in-progress` kills this run whenever a newer push
      # lands on the same ref, leaving the in-flight matrix legs 'cancelled'. The
      # strict check below then reported a RED summary for a run in which nothing
      # had actually failed — every leg that finished was green. During a burst of
      # pushes to develop that produced a string of false reds, which is worse
      # than noise: it trains readers to discount this job, and at a glance it is
      # indistinguishable from the real failure the next step catches.
      #
      # `cancelled()` is true only when the WORKFLOW was cancelled (superseded or
      # cancelled by hand), so splitting on it isolates exactly the benign case.
      # It is not available inside `run:` — only in a step `if:` — hence two steps
      # rather than one branch.
      - name: Report a cancelled run (not a failure)
        if: cancelled()
        run: |
          echo "========================================="
          echo "Cross-Platform Test Summary — CANCELLED"
          echo "========================================="
          echo "Unit Tests: ${{ needs.unit-tests-matrix.result }}"
          echo "Binary Validation: ${{ needs.binary-validation-matrix.result }}"
          echo "Integration Tests: ${{ needs.integration-tests-matrix.result }}"
          echo "========================================="
          echo "⏭️  This run was cancelled — superseded by a newer push on this"
          echo "    ref, or cancelled by hand. No test failure is implied."

      # Everything else stays strict, and a 'cancelled' LEG still fails here.
      #
      # That distinction is load-bearing. With the workflow itself not cancelled, a
      # cancelled matrix leg means it hit `timeout-minutes` and was killed — which
      # IS a failure, and one this repository has actually had: the ubuntu unit leg
      # was killed twice at 20m16s against a 20-minute limit while every test in it
      # was passing (fixed by raising the headroom to 30). Treating 'cancelled' as
      # benign across the board would have hidden that.
      - name: Check test results
        if: ${{ !cancelled() }}
        run: |
          echo "========================================="
          echo "Cross-Platform Test Summary"
          echo "========================================="
          echo "Unit Tests: ${{ needs.unit-tests-matrix.result }}"
          echo "Binary Validation: ${{ needs.binary-validation-matrix.result }}"
          echo "Integration Tests: ${{ needs.integration-tests-matrix.result }}"
          echo "========================================="

          if [[ "${{ needs.unit-tests-matrix.result }}" != "success" ]] || \
             [[ "${{ needs.binary-validation-matrix.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests-matrix.result }}" != "success" ]]; then
            echo "❌ Some tests failed"
            echo ""
            echo "A 'cancelled' leg above means that leg exceeded its"
            echo "timeout-minutes and was killed — the workflow itself was not"
            echo "cancelled, or this step would not have run."
            exit 1
          else
            echo "✅ All cross-platform tests passed!"
          fi
