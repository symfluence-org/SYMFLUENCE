name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate version synchronization
        run: |
          chmod +x scripts/check_version_sync.sh
          ./scripts/check_version_sync.sh

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install minimal deps for linting
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyyaml actionlint-py==1.7.12.24 uv==0.10.4

      - name: Validate GitHub Actions workflows
        run: python scripts/run_actionlint.py

      - name: Guard CI dependency and cache policy
        run: python scripts/check_ci_dependency_policy.py

      - name: Validate universal dependency lock
        run: uv lock --check

      - name: Audit locked runtime dependencies
        run: |
          uv export --quiet --locked --no-dev --no-emit-project \
            --output-file /tmp/symfluence-runtime.txt
          uvx pip-audit -r /tmp/symfluence-runtime.txt --no-deps

      - name: Lint with ruff
        run: |
          # Lint only src and tests, exclude examples (notebooks can be informal)
          ruff check src/ tests/

      - name: Guard broad Exception catches
        run: |
          python scripts/check_broad_exceptions.py

      - name: Guard resilience handlers log with a traceback
        run: |
          python scripts/check_resilience_logging.py

      - name: Guard generic raises in models/
        run: |
          python scripts/check_model_raises.py

      - name: Guard install-manifest consistency
        run: |
          python scripts/check_manifest_consistency.py

      - name: Guard core layering (no core -> upper-layer imports)
        run: |
          python scripts/check_core_layering.py

      # NOTE: the shipped-config strict guard (scripts/check_shipped_configs_strict.py)
      # needs the installed symfluence package to build the recognized-key set, so it
      # is NOT run here (the lint job installs only ruff+pyyaml). It is enforced in the
      # Unit Tests job via tests/unit/config/test_shipped_configs_strict.py, and in
      # pre-commit (language: system).

      - name: Type check with mypy
        continue-on-error: false
        run: |
          # Pinned to match the pre-commit mirrors-mypy hook — the two gates
          # must run the same toolchain or casts valid under one stub version
          # fail the other. Bump both together.
          pip install mypy==2.3.0 pandas-stubs==3.0.3.260530 types-PyYAML types-requests types-psutil
          # Run mypy on source directory
          mypy src/symfluence

  # Fast unit-test gate (ubuntu). The full OS matrix lives in
  # cross-platform.yml (develop/nightly/release); this keeps PRs quick while
  # still gating on tests + coverage.
  #
  # The interpreter matrix is here rather than in cross-platform.yml because a
  # version-specific break must fail the PR, not develop: three tests faking
  # sys.platform='win32' sat broken on 3.12 for as long as CI only ran 3.11,
  # because stdlib shutil.which grew a _winapi call on that branch in 3.12.
  # The legs run in parallel, so covering the declared range costs runner
  # minutes, not wall-clock. These legs ARE the evidence behind
  # requires-python = ">=3.11,<3.14"; keep the two in step, and treat a leg that
  # cannot be made green as a reason to narrow the declared range rather than to
  # drop the leg.
  unit-tests:
    name: Unit Tests (ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    # 30 minutes of headroom. The "intermittent timeout-cancellations" this was
    # originally raised for were NOT a slow suite: every such kill investigated
    # (four across this file and cross-platform.yml) was `apt-get` stalling in
    # "Install system dependencies" — no pytest output in the log at all, and one
    # died at this very 30-minute ceiling, so the raise did not help. The hang is
    # now bounded at that step. This ceiling remains as ordinary headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          version: "0.10.4"

      - name: Compute apt cache key
        id: aptkey
        # ImageOS/ImageVersion are runner shell variables, not part of the
        # workflow `env` context, so ${{ env.ImageVersion }} is empty.
        run: echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore cached apt packages
        # Even bounded and retried, the install step still failed whenever the
        # mirror crawled: on run 40232275315 it delivered ~80 kB/s, so the 163 MB
        # download could not finish inside two 8-minute attempts. Caching the
        # .debs takes the mirror out of the hot path, leaving only `apt-get
        # update`. The key is tied to the runner image, whose package versions are
        # what the cached .debs must match. A new image falls back to the previous
        # cache, so only the packages that changed are re-downloaded.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-debs
          key: apt-debs-v1-${{ runner.os }}-gdal-bin-libgdal-dev-cdo-${{ steps.aptkey.outputs.image }}
          restore-keys: |
            apt-debs-v1-${{ runner.os }}-gdal-bin-libgdal-dev-cdo-

      - name: Install system dependencies
        # Bounded and retried, and given its own timeout, because THIS step is
        # what has actually been killing this job — not the test suite.
        #
        # Four job timeouts across ci.yml and cross-platform.yml were all
        # `apt-get` stalling on a mirror: the last step entered was this one, the
        # logs contain zero pytest output, and the job died at whatever ceiling
        # was configured. Two of the four died at 30 minutes, which is why simply
        # raising the ceiling did not help.
        #
        # apt has no default download timeout, so a stalled connection hangs
        # forever. The drop-in bounds each connection and retries, converting an
        # indefinite hang into a bounded failure. The step timeout then attributes
        # any remaining stall to dependency installation instead of letting it
        # masquerade as a slow test run — normal completion here is 1-2 minutes.
        #
        # Acquire::Retries alone was not enough: it retries individual downloads
        # *within* one apt run, so a run that wedges as a whole still burns the
        # step budget and fails the job (this is what happened on run
        # 30801386860, which hit the 8-minute ceiling). Hence the outer loop —
        # a fresh run generally lands on a different mirror.
        #
        # Sizing the caps: with recommends this pulled 312 packages / 249 MB. A
        # healthy mirror delivers that in ~22s, but mirror throughput varies by
        # ~40x — runs 31111560519 and 31113143558 both crawled at ~240 kB/s,
        # which needs ~17 minutes. Two levers keep that survivable.
        #
        # First, --no-install-recommends. Only gdal-bin, libgdal-dev and cdo are
        # actually needed; the recommends dragged in a plotting data set
        # (libmagics++-data, 20 MB), ghostscript, fonts and sphinx doc packages
        # that nothing here uses. Shrinking the download is what makes a slow
        # mirror finish at all, rather than merely finish more often.
        #
        # Second, the install cap has to cover a slow-but-progressing download,
        # not just a healthy one; a cap sized off healthy runs (the old 3m)
        # failed every attempt on a degraded mirror no matter how many attempts
        # there were. Two attempts at 8m. Step ceiling sits above the worst case
        # of 2 * (2m + 8m) + backoff.
        timeout-minutes: 22
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99symfluence-timeouts > /dev/null
          # Seed apt's archive dir from the cache. apt only reuses a .deb whose
          # version and checksum match the index, so stale ones are harmless.
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then
            echo "Seeding $(ls "$HOME"/apt-debs/*.deb | wc -l) cached .debs"
            sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/
          fi
          for attempt in 1 2; do
            if timeout 2m sudo apt-get update \
               && timeout 8m sudo apt-get install -y --no-install-recommends \
                    gdal-bin libgdal-dev cdo; then
              # Refresh the cache dir (saved at job end on a key miss).
              mkdir -p "$HOME/apt-debs"
              rm -f "$HOME"/apt-debs/*.deb
              cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/" 2>/dev/null || true
              exit 0
            fi
            echo "::warning::apt attempt ${attempt}/2 failed or stalled; retrying"
            # When the cap fires mid-`Setting up`, dpkg is left half-configured
            # and every later apt call aborts in seconds with "dpkg was
            # interrupted, you must manually run 'sudo dpkg --configure -a'" —
            # so without this the remaining attempts cannot succeed and the
            # retry loop is decorative (run 31099033329). Configuring is also
            # resumable: the next attempt keeps the packages the killed one
            # already unpacked, so it finishes well inside the cap.
            timeout 3m sudo dpkg --configure -a || true
            # Deliberately NOT `apt-get clean`: that deletes the partially
            # downloaded .debs, so a retry restarts from zero. On run
            # 31111560519 all three attempts logged an identical "Need to get
            # 249 MB", re-fetching the same bytes and never converging. Keeping
            # the cache lets attempt 2 resume where attempt 1 was cut off.
            sleep 15
          done
          echo "::error::apt-get failed after 2 attempts"
          exit 1

      - name: Install Python dependencies
        run: |
          uv sync --locked --extra test --extra gui
          # On x86_64 Linux, h5py 3.15 and netCDF4 wheels both bundle HDF5
          # 1.14 with unversioned globals. Loading both corrupts dimension-scale
          # state. h5py 3.16 bundles HDF5 2.0, keeping the private symbols
          # isolated. ARM wheels require the opposite pin; this matrix is x64.
          uv pip install --reinstall --only-binary :all: 'h5py>=3.16' netCDF4
          if command -v gdal-config >/dev/null 2>&1; then
            GDAL_VERSION=$(gdal-config --version)
            uv pip install "gdal>=${GDAL_VERSION},<${GDAL_VERSION%.*}.$((${GDAL_VERSION##*.}+1))"
          fi

      - name: Preflight runtime storage backends
        run: uv run --no-sync python scripts/check_runtime_backends.py

      - name: Run unit tests with coverage
        run: |
          # --no-sync preserves the system-matched GDAL binding installed above.
          # tests/conformance/ is NOT optional here: it holds the proofs the
          # service decomposition rests on — that the framework imports and runs
          # with the models layer physically absent (test_models_absent.py), and
          # that the acquisition contract is extractable with no symfluence
          # import (test_extraction_readiness.py). Every workflow passed explicit
          # paths and omitted this directory, so those guards existed but nothing
          # ran them. tests/unit/conftest.py does not apply here, so keep the
          # directory listed explicitly rather than widening to tests/.
          uv run --no-sync pytest --timeout=300 -v --tb=short -m "unit" -n auto \
            --cov --cov-report=term-missing --cov-fail-under=25 \
            tests/unit/ tests/conformance/

      - name: Core coverage gate
        # Single shared definition (scope, omits, threshold rationale) lives in
        # scripts/check_core_coverage.py — never inline this command; the
        # duplicated copies in ci.yml and cross-platform.yml once drifted.
        # Coverage is a property of the codebase, not of the interpreter, so it
        # is gated once rather than per matrix leg.
        if: matrix.python-version == '3.11'
        run: uv run --no-sync python scripts/check_core_coverage.py

      - name: Package import smoke test
        run: |
          uv run --no-sync python -c "import symfluence; from symfluence.core.registries import R; \
            assert R.runners.get('SUMMA') is not None, 'SUMMA not registered via entry points'; \
            print('import + entry-point registration OK')"

      - name: Optional-extra hygiene (core runs without community packages)
        # This job installs no community extras, so it proves the community
        # data packages are genuinely optional: absent from the import graph,
        # yet the acquisition-backend seam still imports and resolves to the
        # native backend. Guards against a community package becoming a hidden
        # hard dependency. See docs/community_services_full_coverage_plan.md.
        run: |
          uv run --no-sync python -c "import importlib.util; \
            absent = [p for p in ('cfs', 'cas', 'csfs', 'cos') if importlib.util.find_spec(p) is None]; \
            assert absent == ['cfs', 'cas', 'csfs', 'cos'], f'community package unexpectedly installed: {sorted(set([\"cfs\",\"cas\",\"csfs\",\"cos\"]) - set(absent))}'; \
            from symfluence.data.backends.selection import select_backend; \
            from symfluence.core.registries import R; \
            assert R.acquisition_backends.get('native') is not None, 'native backend must exist without any community package'; \
            print('optional-extra hygiene OK: core runs, native backend present, no community package required')"

      - name: CLI performance regression tests
        # Lazy-import guard: fails if a heavy dependency creeps into CLI
        # startup. Serial (-n 0) so subprocess wall-clock timings are stable —
        # and on one leg only, so a second interpreter's startup characteristics
        # cannot turn a wall-clock threshold into a coin flip.
        if: matrix.python-version == '3.11'
        run: |
          uv run --no-sync pytest --timeout=300 -m performance -n 0 tests/performance/

  # The PR-time Windows leg.
  #
  # cross-platform.yml owns the full OS matrix, but it triggers only on push to
  # develop/main and nightly — so nothing Windows-specific could ever fail a PR
  # check. #385 merged green under exactly that gap and left develop red for two
  # days on `AttributeError: module 'signal' has no attribute 'SIGKILL'`: a
  # POSIX-only attribute evaluated unconditionally, which the ubuntu legs cannot
  # catch by construction. This job closes that hole at PR time.
  #
  # Deliberately the *lean* Windows leg: uv and the universal lock, no conda and
  # no GDAL. Its job is platform-conditional Python — signals, os.name branches,
  # path separators, subprocess flags — which is where every Windows regression
  # here has actually originated. Full-fidelity Windows coverage (GDAL via
  # conda, binary validation, integration) stays in cross-platform.yml's
  # post-merge tier, so this costs one runner rather than a matrix.
  #
  # Tests needing the GDAL C library skip themselves when it is absent; that is
  # the intended outcome here, and the ubuntu legs above still exercise them.
  unit-tests-windows:
    name: Unit Tests (windows, Python 3.11)
    runs-on: windows-latest
    # The suite itself runs ~9-10 min on a Windows runner; the rest is
    # dependency install. 30 mirrors the ubuntu leg's headroom.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        # No `cache: 'pip'` here — scripts/check_ci_dependency_policy.py forbids
        # it in uv-managed jobs, since uv owns the package cache.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          version: "0.10.4"

      - name: Install Python dependencies
        # GDAL is intentionally absent: the Windows wheel would have to build
        # from source, and the tests that need it skip cleanly without it.
        # No torch index override either — on Windows the default PyPI wheel is
        # already CPU-only, unlike the Linux legs in cross-platform.yml.
        run: uv sync --locked --extra test --extra gui

      - name: Preflight runtime storage backends
        run: uv run --no-sync python scripts/check_runtime_backends.py

      - name: Run unit tests
        # Same scope as the ubuntu legs: tests/conformance/ carries the
        # decomposition proofs and is not optional here either — see the note on
        # the unit-tests job. Coverage is a property of the codebase, not of the
        # interpreter or the OS, so it stays gated once on ubuntu and this leg
        # runs without it to keep the PR gate fast.
        run: |
          uv run --no-sync pytest --timeout=300 --tb=short -m "unit" -n auto \
            tests/unit/ tests/conformance/

  # Build and install the wheel in a fresh environment so built-in backends
  # cannot rely on editable-install paths or undeclared transitive dependencies.
  runtime-backend-contract:
    name: Runtime Backend Contract (wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/symfluence-wheel-contract
          /tmp/symfluence-wheel-contract/bin/python -m pip install --upgrade pip
          WHEEL=$(find dist -name 'symfluence-*.whl' -print -quit)
          /tmp/symfluence-wheel-contract/bin/python -m pip install "${WHEEL}"
          # Match the proven x86_64 wheel-isolation policy used by unit CI.
          /tmp/symfluence-wheel-contract/bin/python -m pip install \
            --force-reinstall --only-binary :all: 'h5py>=3.16' netCDF4

      - name: Validate installed runtime backends
        run: |
          cd /tmp
          /tmp/symfluence-wheel-contract/bin/python \
            "$GITHUB_WORKSPACE/scripts/check_runtime_backends.py" \
            --require-installed-wheel

  # The models-absent contract, enforced physically rather than simulated.
  #
  # tests/conformance/test_models_absent.py already proves this with a
  # sys.meta_path blocker and a stubbed entry_points(), which is fast and runs on
  # every platform. But the models code is still on disk and still importable
  # there, so it cannot catch a real packaging dependency: a console script that
  # imports a model at start-up, an entry point pointing into
  # symfluence.models, or importlib.resources reaching for a model's bundled
  # data. Those only surface when the directory is genuinely gone.
  #
  # So: build the wheel, install it clean, DELETE symfluence/models from the
  # installed tree, and run the framework against what is left with nothing
  # patched. The two checks are complementary — keep both.
  models-absent-contract:
    name: Models-Absent Contract (stripped wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/symfluence-models-absent
          /tmp/symfluence-models-absent/bin/python -m pip install --upgrade pip
          WHEEL=$(find dist -name 'symfluence-*.whl' -print -quit)
          /tmp/symfluence-models-absent/bin/python -m pip install "${WHEEL}"
          # Match the proven x86_64 wheel-isolation policy used by unit CI.
          /tmp/symfluence-models-absent/bin/python -m pip install \
            --force-reinstall --only-binary :all: 'h5py>=3.16' netCDF4

      - name: Physically remove the models package
        run: |
          SITE=$(/tmp/symfluence-models-absent/bin/python -c \
            'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          MODELS="${SITE}/symfluence/models"
          # Fail loudly if the layout is not what we expect, rather than deleting
          # nothing and letting the contract check pass vacuously.
          test -d "${MODELS}" || { echo "expected ${MODELS} to exist"; exit 1; }
          rm -rf "${MODELS}"
          test ! -e "${MODELS}"
          echo "removed ${MODELS}"

      - name: Validate the models-absent contract
        run: |
          # Run from /tmp so the repository's own src/ cannot satisfy the import
          # that the stripped install is supposed to fail.
          cd /tmp
          /tmp/symfluence-models-absent/bin/python \
            "$GITHUB_WORKSPACE/scripts/check_models_absent.py"
