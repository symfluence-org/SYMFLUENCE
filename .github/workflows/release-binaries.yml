name: Release Binaries

on:
  # Trigger on v* tag pushes (not example-data or other tags)
  push:
    tags:
      - 'v[0-9]*'
  # Weekly rebuild to keep binaries fresh (Sundays at 04:00 UTC)
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.7.0). Leave empty to rebuild latest release.'
        required: false
        type: string

defaults:
  run:
    shell: bash -l {0}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false  # Don't cancel releases

permissions:
  contents: read

jobs:
  # Release branch gate. publish-npm and test-npm-install hang off
  # build-and-release, so gating it gates the publishing path too. Scheduled
  # rebuilds and workflow_dispatch runs are allowed through unchanged.
  gate:
    name: Verify release branch
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.verify.outputs.allowed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify release branch
        id: verify
        uses: ./.github/actions/verify-release-branch

  build-and-release:
    name: Build & Release (${{ matrix.platform }})
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-x86_64 is built INSIDE an old-glibc container (Debian 11
          # "bullseye", glibc 2.31) so the bundled GCC/netCDF/HDF5 runtimes don't
          # carry a too-new GLIBC_2.3x symbol requirement. This lowers the release
          # floor from the host's 2.39 to 2.31 — covering RHEL/Rocky 9 (2.34),
          # Debian 11/12, Ubuntu 20.04+. The host runner only hosts the container.
          # python:3.11-slim-bullseye ships Python 3.11 against glibc 2.31
          # directly, avoiding the deadsnakes-PPA / GLIBC_2.34 setup-python
          # breakage that an Ubuntu base hit. (#156 G6 release-pipeline glibc floor.)
          - os: ubuntu-22.04
            container: python:3.11-slim-bullseye
            platform: linux-x86_64
            python-version: '3.11'
          - os: macos-latest  # ARM Mac (M1/M2)
            platform: macos-arm64
            python-version: '3.11'
          - os: windows-2022
            platform: windows-x86_64
            python-version: '3.11'

    runs-on: ${{ matrix.os }}
    # Empty for macOS/Windows rows -> the job runs directly on the host runner.
    container: ${{ matrix.container || '' }}
    # Raised from 120: the Windows job now also builds netCDF-C from source
    # (~10 min, dominated by CMake's feature probes) before building the models.
    timeout-minutes: 150
    permissions:
      contents: write  # Required for creating/updating releases

    env:
      SYMFLUENCE_CODE: ${{ github.workspace }}
      SYMFLUENCE_DATA: ${{ github.workspace }}/symfluence_data
      SYMFLUENCE_DATA_DIR: ${{ github.workspace }}/symfluence_data

    steps:
      # The ubuntu:20.04 container is minimal: install what the JS actions and
      # later steps need (git for `checkout --submodules`, sudo for the apt
      # steps, file for the bundling step) BEFORE checkout. Runs as root.
      - name: Bootstrap build container (old-glibc Linux)
        if: matrix.container != ''
        env:
          # No TTY in the container: tzdata (an apt dependency) would otherwise
          # launch an interactive timezone prompt and hang the job forever.
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          set -e
          # python:3.11-slim-bullseye already provides Python 3.11 built against
          # glibc 2.31, so we only need the OS build toolchain + the utilities
          # later steps rely on (git/sudo/file/...).
          # Debian 11 (bullseye) has left deb.debian.org: since Sep 2026 its
          # security index still lists packages whose .debs are gone (404). Point apt
          # at archive.debian.org, which carries the complete suites.
          if grep -q '^VERSION_CODENAME=bullseye' /etc/os-release; then
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$f" ] && sed -i -e 's#https\?://deb\.debian\.org#http://archive.debian.org#g' \
                                    -e 's#https\?://security\.debian\.org#http://archive.debian.org#g' "$f"
            done
          fi
          # Retry transient mirror hiccups ("Connection reset by peer") instead
          # of failing the whole job on a single dropped .deb.
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            sudo git ca-certificates curl wget xz-utils file build-essential tzdata
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      # In a container job, ${{ github.workspace }} (baked into the job-level env)
      # is the HOST path /home/runner/work/... which does not exist inside the
      # container — the workspace is mounted at $GITHUB_WORKSPACE (/__w/...). The
      # tool build auto-detects the container path and installs there, but the
      # metadata/staging steps would read the host-path env and miss it. Re-point
      # the SYMFLUENCE_* paths at $GITHUB_WORKSPACE for the container.
      - name: Fix workspace paths (container)
        if: matrix.container != ''
        run: |
          echo "SYMFLUENCE_CODE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "SYMFLUENCE_DATA=$GITHUB_WORKSPACE/symfluence_data" >> "$GITHUB_ENV"
          echo "SYMFLUENCE_DATA_DIR=$GITHUB_WORKSPACE/symfluence_data" >> "$GITHUB_ENV"

      # Only on real runners — the container already provides Python 3.11
      # (setup-python's binary needs a newer glibc than the container has).
      - name: Set up Python
        if: matrix.container == ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # bullseye ships cmake 3.18; several model builds need >= 3.20. Use the pip
      # wheels (recent cmake/ninja), placed ahead of /usr/bin on PATH. meson is
      # here too: MODFLOW 6's USGS prebuilt needs GLIBC_2.34 (above our 2.31
      # floor), so on this container it's source-built via meson — but the
      # installer only auto-installs meson inside a venv/conda, and this is bare
      # system Python, so provide it up front or mf6 silently won't ship on Linux.
      - name: Upgrade build tools in container (old-glibc Linux)
        if: matrix.container != ''
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cmake>=3.22" ninja meson

      # ========================================================================
      # Pre-Release Validation
      # ========================================================================
      - name: Validate version synchronization
        run: |
          echo "Checking that pyproject.toml and npm/package.json versions match..."
          chmod +x scripts/check_version_sync.sh
          ./scripts/check_version_sync.sh

      # ========================================================================
      # Linux System Dependencies
      # ========================================================================
      # Deliberately NOT mirroring the Windows "netCDF without S3" rebuild here.
      # Two reasons, in order of weight:
      #   1. The teardown deadlock is a Windows-only failure mode. It needs
      #      ExitProcess semantics: RtlExitUserProcess terminates every thread
      #      but the caller's, THEN runs DLL_PROCESS_DETACH, so netCDF's
      #      Aws::ShutdownAPI hook waits on threads that no longer exist. POSIX
      #      exit() has no equivalent step.
      #   2. There is nothing to remove: Debian's libnetcdf-dev is already built
      #      without the AWS SDK (`libnetcdf.settings` reports "S3 Support: no",
      #      and libnetcdf.so links no libaws*), on both the bullseye build
      #      container and the Ubuntu hosts that consume the artifact. Debian
      #      does not package aws-sdk-cpp.
      # Rebuilding netCDF on Linux would therefore add build time and risk while
      # removing no functionality that is present — and disabling S3 where it IS
      # present would silently drop remote-object access someone may rely on.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y \
            build-essential gfortran cmake \
            openmpi-bin libopenmpi-dev \
            gdal-bin libgdal-dev \
            libnetcdf-dev libnetcdff-dev \
            libhdf5-dev libudunits2-dev \
            libopenblas-dev liblapack-dev \
            patchelf \
            tcl-dev libxml2-utils libexpat1-dev \
            libxml-libxml-perl

      - name: Configure compiler env (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=mpicc" >> $GITHUB_ENV
          echo "CXX=mpicxx" >> $GITHUB_ENV
          echo "FC=gfortran" >> $GITHUB_ENV

      # ========================================================================
      # macOS System Dependencies
      # ========================================================================
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc cmake open-mpi netcdf netcdf-fortran hdf5 gdal udunits m4 libxml2 flex cpanminus

          # flex needs gm4 (GNU m4) but macOS Sequoia removed /usr/bin/gm4.
          # Homebrew flex uses the correct path; ensure it's found first.
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH

          # CLM/CESM needs Perl XML::LibXML for namelist generation
          cpanm --notest XML::LibXML 2>/dev/null || true

          # Set up Fortran compiler paths
          GCC_VER=$(ls /opt/homebrew/bin/gfortran-* 2>/dev/null | sort -t- -k2 -n | tail -1 | sed 's/.*gfortran-//')
          if [ -n "$GCC_VER" ]; then
            echo "FC=/opt/homebrew/bin/gfortran-${GCC_VER}" >> $GITHUB_ENV
            echo "CC=/opt/homebrew/bin/gcc-${GCC_VER}" >> $GITHUB_ENV
            echo "CXX=/opt/homebrew/bin/g++-${GCC_VER}" >> $GITHUB_ENV
            echo "/opt/homebrew/bin" >> $GITHUB_PATH

            # Create unversioned gfortran symlink — Homebrew only installs
            # versioned binaries (gfortran-13, etc.); the dependency checker
            # looks for plain 'gfortran' via shutil.which().
            ln -sf /opt/homebrew/bin/gfortran-${GCC_VER} /opt/homebrew/bin/gfortran
          fi

          # Help CMake find Homebrew packages (especially udunits)
          echo "CMAKE_PREFIX_PATH=/opt/homebrew" >> $GITHUB_ENV
          echo "UDUNITS2_ROOT=/opt/homebrew" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      # ========================================================================
      # Windows System Dependencies
      # ========================================================================
      - name: Set up Miniconda (Windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          auto-update-conda: false
          channels: conda-forge
          conda-remove-defaults: true
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # ── Native Windows toolchain via MSYS2 mingw-w64 (UCRT-free mingw64) ──
          # The old m2w64-gcc-fortran is gfortran 5.3.0 (2016), which cannot read
          # the netcdf.mod shipped by modern conda-forge netcdf-fortran ("not a
          # GNU Fortran module file"), breaking every Fortran tool. Use MSYS2's
          # current mingw-w64 toolchain AND its matching scientific libraries so
          # the compiler and the .mod files come from the same modern gfortran.
          set -e
          export PATH="/c/msys64/usr/bin:$PATH"
          # MSYS2 mirrors are flaky ("Operation too slow. Less than 1 bytes/sec");
          # retry the whole transaction a few times before giving up. --needed
          # makes each retry skip already-installed packages, so progress carries
          # across attempts.
          _pac=( pacman -S --noconfirm --needed
            make m4 bison flex
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-netcdf
            mingw-w64-x86_64-netcdf-fortran
            mingw-w64-x86_64-hdf5
            mingw-w64-x86_64-openblas
            mingw-w64-x86_64-openlibm
            mingw-w64-x86_64-gdal
            mingw-w64-x86_64-proj
            mingw-w64-x86_64-geos
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-udunits
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-msmpi
            mingw-w64-x86_64-dlfcn )
          for _try in 1 2 3 4 5; do
            echo "pacman install attempt $_try..."
            if "${_pac[@]}"; then break; fi
            if [ "$_try" = 5 ]; then echo "pacman failed after 5 attempts" >&2; exit 1; fi
            echo "retrying after mirror failure..."; sleep 15
          done
          # Hand the installed netCDF-C version to the no-S3 rebuild below. That
          # step runs in Git Bash, where this MSYS2 pacman is not reachable.
          NC_VER="$(pacman -Q mingw-w64-x86_64-netcdf | awk '{print $2}' | cut -d- -f1)"
          [ -n "$NC_VER" ] || { echo "could not read mingw-w64-x86_64-netcdf version" >&2; exit 1; }
          echo "NETCDF_VERSION=$NC_VER" >> $GITHUB_ENV

          # pip still needed for the Python-packaged tools (troute, ngen helpers)
          conda install -y pip numpy

          # Put the mingw64 toolchain first on PATH so its gcc/gfortran/nf-config
          # win over conda's m2w64 and the MSYS2 msys gcc.
          MINGW_BIN="C:/msys64/mingw64/bin"
          echo "$MINGW_BIN" >> $GITHUB_PATH

          # Compiler + library roots come from the SAME mingw64 toolchain.
          # Do NOT export CONDA_PREFIX for the build: it would steer the library
          # detection back to conda's mismatched netcdf-fortran.
          echo "CC=$MINGW_BIN/gcc.exe" >> $GITHUB_ENV
          echo "CXX=$MINGW_BIN/g++.exe" >> $GITHUB_ENV
          echo "FC=$MINGW_BIN/gfortran.exe" >> $GITHUB_ENV
          echo "NETCDF=C:/msys64/mingw64" >> $GITHUB_ENV
          echo "NETCDF_FORTRAN=C:/msys64/mingw64" >> $GITHUB_ENV
          echo "SYMFLUENCE_NO_VENV=true" >> $GITHUB_ENV
          echo "SYMFLUENCE_PYTHON=python" >> $GITHUB_ENV

      # ── netCDF without the AWS S3 SDK (Windows) ──────────────────────────
      # MSYS2's stock mingw-w64-x86_64-netcdf enables the aws-sdk-cpp S3 driver.
      # netCDF's DLL_PROCESS_DETACH hook then calls Aws::ShutdownAPI, which waits
      # on a condition variable for AWS CRT worker threads that RtlExitUserProcess
      # has already killed — so it blocks forever. The model gets a valid exit
      # code but its last thread never finishes, the process object never
      # signals (GetExitCodeProcess succeeds while WaitForSingleObject hangs),
      # and the unkillable zombie keeps holding its output NetCDF handles. Every
      # SUMMA/FUSE run on native Windows left one behind; they accumulated past
      # 70 and broke subsequent calibration evaluations.
      #
      # Approach: keep installing the stock package (netcdf-fortran, the headers,
      # nc-config and the .cmake/.pc files must stay consistent, and the package
      # pulls in every optional filter backend), then rebuild ONLY netCDF-C at
      # the same version with -DNETCDF_ENABLE_S3=OFF -DNETCDF_ENABLE_S3_AWS=OFF
      # and install it over the prefix. Byte-range (curl-only) support stays on.
      # The script proves the result is a drop-in before the job continues: it
      # diffs the export table against the stock DLL (only NC_s3sdk*/
      # NCZ_s3finalize may disappear) and checks that every symbol
      # libnetcdff-7.dll imports is still exported, so no model needs relinking.
      # Everything the bundler later copies out of mingw64/bin is then S3-free.
      - name: Rebuild netCDF without AWS S3 (Windows)
        if: runner.os == 'Windows'
        run: |
          set -e
          chmod +x ./scripts/build_netcdf_no_s3_mingw.sh
          # The prefix is left to the script's default (C:/msys64/mingw64)
          # rather than passed as a command prefix: a `VAR=x script` assignment
          # is silently dropped when the caller and the script's interpreter
          # come from different msys2 runtimes, and a dropped prefix here would
          # be indistinguishable from success.
          ./scripts/build_netcdf_no_s3_mingw.sh "${RUNNER_TEMP}/netcdf-noS3"

      - name: Install MS-MPI (Windows)
        if: runner.os == 'Windows'
        uses: mpi4py/setup-mpi@3417e34f1394a16723d7913c236642c24e95fd5a # v1
        with:
          mpi: msmpi

      # ========================================================================
      # Build Tools
      # ========================================================================
      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Build external tools
        run: |
          mkdir -p "${{ env.SYMFLUENCE_DATA }}"

          # Ensure we use Python from setup-python action (or conda on Windows)
          if [ "${{ runner.os }}" = "Windows" ]; then
            PYTHON_CMD="${SYMFLUENCE_PYTHON:-python}"
          elif [ -n "$Python3_ROOT_DIR" ]; then
            export PATH="$Python3_ROOT_DIR/bin:$PATH"
            echo "Prepended Python3_ROOT_DIR to PATH: $Python3_ROOT_DIR/bin"
            PYTHON_CMD="python3"
          elif [ -n "$pythonLocation" ]; then
            export PATH="$pythonLocation/bin:$PATH"
            echo "Prepended pythonLocation to PATH: $pythonLocation/bin"
            PYTHON_CMD="python3"
          else
            PYTHON_CMD="python3"
          fi

          # Verify we're using the correct Python
          echo "Python location: $(which $PYTHON_CMD)"
          echo "Python version: $($PYTHON_CMD --version)"

          # Install GDAL Python bindings (needed when gdal-config is available)
          # Skip on Windows — conda's gdal-config is a batch file, not bash-compatible
          if [ "${{ runner.os }}" != "Windows" ] && command -v gdal-config >/dev/null 2>&1; then
            GDAL_VERSION=$(gdal-config --version)
            GDAL_MAJOR=${GDAL_VERSION%%.*}
            GDAL_MINOR=$(echo "$GDAL_VERSION" | cut -d. -f2)
            # GDAL's SWIG Python bindings before 3.3.0 do `Py_REFCNT(o) = ...`,
            # which stopped being an lvalue in Python 3.10 — building them from
            # sdist on the 3.11 runners fails with "object.h: lvalue required"
            # (this is what bit the old-glibc Debian bullseye container, whose
            # system libgdal is 3.2.2). The release ships binaries, and python-gdal
            # is an optional, lazily-imported extra not needed to compile them, so
            # skip the un-buildable old bindings rather than fail the wheel build.
            # Newer system GDAL (e.g. macOS Homebrew) still installs as before.
            if [ "${GDAL_MAJOR:-0}" -lt 3 ] || { [ "${GDAL_MAJOR:-0}" -eq 3 ] && [ "${GDAL_MINOR:-0}" -lt 3 ]; }; then
              echo "::warning::System GDAL $GDAL_VERSION (<3.3) has no Python 3.10+-compatible bindings; skipping (not needed for binary builds)"
            else
              echo "Installing GDAL Python bindings ($GDAL_VERSION)..."
              # Use strict version range to match system libgdal precisely
              # e.g., if 3.12.0, allow 3.12.0.post1 but NOT 3.12.1
              "$PYTHON_CMD" -m pip install "gdal>=${GDAL_VERSION},<${GDAL_VERSION%.*}.$((${GDAL_VERSION##*.}+1))"
            fi
          fi

          # Install SYMFLUENCE package
          "$PYTHON_CMD" -m pip install -e .

          # Build default external tools using symfluence command
          echo "Running: symfluence binary install"
          ./scripts/symfluence-bootstrap binary install

          echo "Default tools build completed"

          # Install experimental models for release
          RELEASE_EXTRAS="vic swat prms mhm crhm wrfhydro watflood modflow parflow clmparflow pihm gsflow clm rhessys wmfire noahmp"
          for tool in $RELEASE_EXTRAS; do
            # CLM/CTSM is explicitly unsupported on Windows: its build pulls
            # external components via git-fleximod (which loops to a MemoryError
            # on MSYS path layout) and then needs ESMF + a full CIME machine port
            # on MinGW — a multi-week effort with no upstream support. Skip it on
            # Windows rather than emit a perpetual non-fatal failure warning.
            # (clmparflow ships on Windows via the standalone ParFlow POSIX shims.)
            if [ "$tool" = "clm" ] && [ "${{ runner.os }}" = "Windows" ]; then
              echo "::notice::Skipping clm on Windows — ESMF/CIME on MinGW is unsupported"
              continue
            fi
            echo "::group::Installing $tool"
            # RHESSys must ship patched. `--paper-repro` forces --patched
            # because the paper's runs use the SYMFLUENCE subsurface-GW
            # pathway, and binary_commands.py records why: "an unpatched
            # binary silently caps calibration." This loop did not pass the
            # flag, so released/npm RHESSys was NOT the paper's binary — it
            # scores KGE ~0.15 against ~0.85, with nothing failing to say so.
            # Keep this list in step with the --paper-repro behaviour.
            EXTRA_INSTALL_FLAGS=""
            case "$tool" in
              rhessys) EXTRA_INSTALL_FLAGS="--patched" ;;
            esac
            # Non-fatal, but emit a ::warning:: so a build that stops producing a
            # tool shows up in the job summary instead of being buried in the log.
            "$PYTHON_CMD" -m symfluence binary install "$tool" $EXTRA_INSTALL_FLAGS \
              || echo "::warning::Optional model '$tool' failed to build on ${{ matrix.platform }} (non-fatal — not shipped this release)"
            echo "::endgroup::"
          done

          echo "Build external tools completed successfully"

          # Debug: Verify installation directory
          echo "Verifying installation directory:"
          ls -la "${{ env.SYMFLUENCE_DATA }}" || echo "SYMFLUENCE_DATA not found"
          ls -la "${{ env.SYMFLUENCE_DATA }}/installs" || echo "installs directory not found"

      # ========================================================================
      # Generate Release Artifacts
      # ========================================================================
      - name: Generate toolchain metadata
        run: |
          set -e
          chmod +x ./scripts/generate_toolchain.sh
          ./scripts/generate_toolchain.sh \
            "${{ env.SYMFLUENCE_DATA }}/installs" \
            "${{ env.SYMFLUENCE_DATA }}/installs/toolchain.json" \
            "${{ matrix.platform }}"

      - name: Stage release artifacts
        run: |
          set -e
          chmod +x ./scripts/stage_release_artifacts.sh
          mkdir -p ./release
          ./scripts/stage_release_artifacts.sh \
            "${{ matrix.platform }}" \
            "${{ env.SYMFLUENCE_DATA }}/installs" \
            "./release"

      - name: Verify binary portability
        run: |
          set -e
          chmod +x ./scripts/verify_binary_portability.sh
          ./scripts/verify_binary_portability.sh \
            "./release/symfluence-tools/bin" || {
            echo "⚠️  Portability verification had warnings but continuing..."
            echo "   Review the output above for potential issues"
          }

      - name: Create release tarball
        run: |
          set -e
          chmod +x ./scripts/create_release_tarball.sh

          # Get version from tag, manual input, or latest git tag
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
          fi

          ./scripts/create_release_tarball.sh \
            "$VERSION" \
            "${{ matrix.platform }}" \
            "./release/symfluence-tools" \
            "./release"

      - name: Test artifact relocatability
        run: |
          set -e
          echo "Testing relocated binaries..."

          # Extract to temporary location
          TEST_DIR="${RUNNER_TEMP:-/tmp}/symfluence-test"
          mkdir -p "$TEST_DIR"
          cd "$TEST_DIR"

          TARBALL=$(ls "$GITHUB_WORKSPACE"/release/symfluence-tools-*.tar.gz 2>/dev/null | head -1)
          # --force-local: treat D: as filename, not remote host (Windows only; BSD tar doesn't support it)
          TAR_ARGS="-xzf"
          case "$(uname -s 2>/dev/null)" in MSYS*|MINGW*|CYGWIN*) TAR_ARGS="--force-local $TAR_ARGS" ;; esac
          tar $TAR_ARGS "$TARBALL"

          # Verify lib/ directory was included
          echo "-> Checking lib/ directory..."
          if [ -d "./symfluence-tools/lib" ]; then
            echo "  lib/ contents:"
            ls -lh ./symfluence-tools/lib/ 2>/dev/null || echo "  (empty)"
          else
            echo "  No lib/ directory found"
          fi

          # A relocated binary is broken if it cannot resolve its shared
          # libraries. Detect that explicitly instead of swallowing the result
          # with `|| echo`, which hid genuine relocation failures. Covers both
          # unix loader errors (dyld / "library not loaded" / ...) and Windows
          # DLL-load failures ("code execution cannot proceed" / 0xC0000135,
          # which also typically produce no stdout — caught by the empty-output
          # branch). Non-zero --version/--help exit codes are tolerated.
          check_relocated() {
            local name="$1" bin="$2"; shift 2
            if [ ! -f "$bin" ] && [ ! -f "$bin.exe" ]; then
              echo "  (skipping $name — not present in this build)"
              return 0
            fi
            local out
            out="$("$bin" "$@" 2>&1 | head -20 || true)"
            echo "$out"
            if echo "$out" | grep -qiE "dyld|library not loaded|image not found|error while loading shared|cannot open shared object|symbol not found|code execution cannot proceed|0xc0000135"; then
              echo "::error::$name failed to load shared libraries after relocation"
              return 1
            fi
            # Empty output is NOT proof of failure: a real DLL/shared-lib load
            # failure emits one of the patterns above (on Windows the loader
            # prints "code execution cannot proceed ... 0xC0000135" to stderr,
            # captured via 2>&1). Some tools legitimately print nothing for
            # --help/--version (e.g. ngen takes positional args and has no help
            # flag). Treat empty output as a warning, not a hard failure.
            if [ -z "$out" ]; then
              echo "::warning::$name produced no output after relocation (no loader error — likely just no --help/--version text)"
              return 0
            fi
            echo "  ✓ $name runs after relocation"
          }

          # Test binaries run without their original install directory
          echo "-> Testing SUMMA...";  check_relocated SUMMA ./symfluence-tools/bin/summa --version
          echo "-> Testing NGEN...";   check_relocated NGEN  ./symfluence-tools/bin/ngen --help

          echo "Relocatability test complete"

      # Re-run the import-closure check against the EXTRACTED TARBALL rather than
      # the staging tree, so what is actually shipped is what gets verified. This
      # is a static check on every packaged PE image (not just the two probed
      # above) because a missing DLL on Windows produces no output at all —
      # running the binary is not a reliable detector.
      - name: Verify packaged DLL closure (Windows)
        if: runner.os == 'Windows'
        run: |
          set -e
          TEST_DIR="${RUNNER_TEMP:-/tmp}/symfluence-test"
          chmod +x ./scripts/check_windows_dll_closure.sh
          ./scripts/check_windows_dll_closure.sh \
            "$TEST_DIR/symfluence-tools/bin" \
            "$TEST_DIR/symfluence-tools/lib"

          # Record the netCDF build that actually shipped. S3 must be off or the
          # deadlock at process teardown is back.
          if [ -f "$TEST_DIR/symfluence-tools/bin/libnetcdf.dll" ]; then
            AWS=$(/c/msys64/mingw64/bin/objdump.exe -p \
              "$TEST_DIR/symfluence-tools/bin/libnetcdf.dll" \
              | grep -ci 'DLL Name: libaws' || true)
            echo "packaged libnetcdf.dll AWS SDK imports: $AWS"
            if [ "$AWS" != "0" ]; then
              echo "::error::Packaged libnetcdf.dll still links the AWS S3 SDK — model processes will deadlock at exit on Windows"
              exit 1
            fi
          fi

      # ========================================================================
      # Upload to GitHub Release
      # ========================================================================
      - name: Resolve release tag
        id: resolve-tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          fi

      # A manual workflow_dispatch without an explicit tag input resolves the tag
      # via `git describe`, which points at the latest release (e.g. v0.9.0).
      # Uploading branch-built binaries there would clobber the real release
      # assets, so only upload for tag pushes, scheduled rebuilds, or a dispatch
      # that explicitly names a tag. Dispatch-without-tag still builds + tests
      # (and keeps the backup workflow artifact) but uploads nothing.
      - name: Upload to Release
        if: steps.resolve-tag.outputs.tag != '' && (github.event_name != 'workflow_dispatch' || github.event.inputs.tag != '')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag }}
          files: |
            release/symfluence-tools-*.tar.gz
            release/symfluence-tools-*.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symfluence-tools-${{ matrix.platform }}
          path: |
            release/symfluence-tools-*.tar.gz
            release/symfluence-tools-*.sha256
          retention-days: 90

  # ===========================================================================
  # Publish to npm
  # ===========================================================================
  publish-npm:
    name: Publish to npm
    needs: build-and-release
    runs-on: ubuntu-24.04
    # Proceed even if Windows build fails — it has no required binaries and
    # shouldn't block npm publishing for Linux/macOS users.
    if: ${{ !cancelled() && (needs.build-and-release.result == 'success' || needs.build-and-release.result == 'failure') }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify required platform artifacts exist
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Checking release $TAG for required platform artifacts..."
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)
          MISSING=0
          for platform in linux-x86_64 macos-arm64; do
            if echo "$ASSETS" | grep -q "$platform"; then
              echo "Found artifact for $platform"
            else
              echo "ERROR: Missing artifact for $platform"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "Cannot publish to npm without Linux and macOS artifacts"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package version matches release tag
        if: github.event_name == 'push'
        working-directory: npm
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Release tag: $TAG"
          echo "Version from tag: $VERSION"
          echo "Package.json version: $PKG_VERSION"

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch! package.json=$PKG_VERSION tag=$TAG"
            echo "Update npm/package.json to version $VERSION and try again"
            exit 1
          fi
          echo "Version check passed: $VERSION"

      - name: Publish to npm (dry run)
        if: github.event_name == 'workflow_dispatch'
        working-directory: npm
        run: |
          echo "Running npm publish in dry-run mode (workflow_dispatch)"
          npm publish --dry-run

      - name: Check if version already published
        if: github.event_name == 'push'
        id: npm-check
        working-directory: npm
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "symfluence@${PKG_VERSION}" version 2>/dev/null; then
            echo "Version ${PKG_VERSION} already published to npm, skipping"
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${PKG_VERSION} not yet published"
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm (production)
        if: github.event_name == 'push' && steps.npm-check.outputs.already_published != 'true'
        working-directory: npm
        run: |
          echo "Publishing to npm registry..."
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip npm publish (scheduled rebuild)
        if: github.event_name == 'schedule'
        run: echo "Scheduled rebuild — skipping npm publish (binaries updated on GitHub Release only)"

  # ===========================================================================
  # Test npm Installation
  # ===========================================================================
  test-npm-install:
    name: Test npm Install (${{ matrix.os }})
    needs: publish-npm
    if: success()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      # Needed for scripts/check_windows_dll_closure.sh below — this job
      # otherwise only consumes the published npm package.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf19t64 libnetcdff7 libhdf5-103-1t64 libgdal34t64

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install netcdf netcdf-fortran hdf5 gdal

      - name: Install symfluence from npm
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=""
          fi

          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
            echo "Installing symfluence@${VERSION} from npm..."
            npm install -g "symfluence@${VERSION}"
          else
            echo "Installing latest symfluence from npm..."
            npm install -g symfluence
          fi

      - name: Test CLI commands
        run: |
          echo "Testing symfluence CLI commands..."

          symfluence help
          echo "help command works"

          symfluence version
          echo "version command works"

          symfluence path
          echo "path command works"

      - name: Test info command and binary detection
        run: |
          echo "Testing symfluence info..."
          symfluence info

          # Verify binaries directory exists
          BIN_DIR=$(symfluence path)
          if [ ! -d "$BIN_DIR" ]; then
            echo "Binary directory not found: $BIN_DIR"
            exit 1
          fi
          echo "Binary directory exists: $BIN_DIR"

      - name: Verify critical binaries exist
        run: |
          BIN_DIR=$(symfluence path)
          FOUND=0
          MISSING_REQUIRED=0

          # Platform-specific requirements
          if [ "${{ runner.os }}" = "Linux" ]; then
            REQUIRED_BINS="summa mizuroute"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            # Windows: Fortran cross-compilation is unreliable; no required binaries
            REQUIRED_BINS=""
          else
            REQUIRED_BINS="mizuroute"
          fi

          # On-disk binary names (not config keys): modflow->mf6, clmparflow->
          # parflow-clm. `pitremove` stands in for TauDEM's 13 utilities (if the
          # TauDEM build fails, none exist). Keep this list in sync with what the
          # build actually stages, or a tool can silently stop shipping unnoticed.
          OPTIONAL_BINS="fuse ngen vic swat prms mhm crhm wrfhydro watflood mf6 parflow parflow-clm pitremove pihm gsflow clm rhessys hype mesh noah_owp_modular"

          for binary in $REQUIRED_BINS; do
            if [ -f "$BIN_DIR/$binary" ] || [ -f "$BIN_DIR/$binary.exe" ]; then
              echo "Found $binary"
              FOUND=$((FOUND + 1))
            else
              echo "Missing required binary: $binary"
              MISSING_REQUIRED=$((MISSING_REQUIRED + 1))
            fi
          done

          for binary in $OPTIONAL_BINS; do
            if [ -f "$BIN_DIR/$binary" ] || [ -f "$BIN_DIR/$binary.exe" ]; then
              echo "Found $binary"
              FOUND=$((FOUND + 1))
            else
              echo "Optional binary not found: $binary"
            fi
          done

          echo "Found $FOUND binaries total"
          if [ $MISSING_REQUIRED -gt 0 ]; then
            echo "$MISSING_REQUIRED required binaries missing"
            exit 1
          fi

      # The published Windows package must be self-contained: a tool that is
      # missing one imported DLL exits with 0xC0000135 before main() and prints
      # nothing, which the calibration framework records as a -9999 score rather
      # than a failure. Check the import closure statically on what npm shipped.
      - name: Verify npm-installed DLL closure (Windows)
        if: runner.os == 'Windows'
        run: |
          set -e
          # objdump comes from the MSYS2 toolchain preinstalled on the Windows
          # runners. If it is ever absent the script degrades to a warning
          # rather than a false failure.
          export PATH="/c/msys64/mingw64/bin:$PATH"
          BIN_DIR=$(symfluence path)
          chmod +x ./scripts/check_windows_dll_closure.sh
          ./scripts/check_windows_dll_closure.sh "$BIN_DIR" "$BIN_DIR/../lib"

      - name: Test binary execution
        run: |
          set -e
          BIN_DIR=$(symfluence path)

          # Hard-fail only on (a) a missing *required* binary or (b) a loader
          # error (unix or Windows DLL load). Empty --version/--help output is
          # tolerated — some tools print nothing and exit non-zero — matching
          # the relocatability check. Optional binaries that aren't bundled for
          # a given platform are skipped, not failed. Required/optional must
          # mirror the "Verify critical binaries exist" step above.
          LOADER_ERRORS="dyld|library not loaded|image not found|error while loading shared|cannot open shared object|symbol not found|code execution cannot proceed|0xc0000135"

          check_binary() {
            local mode="$1" name="$2" bin="$3"; shift 3
            if [ ! -f "$bin" ] && [ ! -f "$bin.exe" ]; then
              if [ "$mode" = required ]; then
                echo "::error::$name (required) binary not found at $bin"
                return 1
              fi
              echo "  - $name not bundled (optional) — skipping"
              return 0
            fi
            local out
            out="$("$bin" "$@" 2>&1 | head -20 || true)"
            echo "$out"
            if echo "$out" | grep -qiE "$LOADER_ERRORS"; then
              echo "::error::$name failed to load shared libraries"
              return 1
            fi
            echo "  ✓ $name is executable"
          }

          # Platform-specific required set. Windows Fortran cross-compilation is
          # unreliable, so nothing is required there; ngen is optional everywhere.
          if [ "${{ runner.os }}" = "Linux" ]; then
            SUMMA_MODE=required; MIZU_MODE=required
          elif [ "${{ runner.os }}" = "Windows" ]; then
            SUMMA_MODE=optional; MIZU_MODE=optional
          else
            SUMMA_MODE=optional; MIZU_MODE=required
          fi

          echo "Testing SUMMA...";     check_binary "$SUMMA_MODE" SUMMA     "$BIN_DIR/summa"     --version
          echo "Testing mizuRoute..."; check_binary "$MIZU_MODE"  mizuRoute "$BIN_DIR/mizuroute" --help
          echo "Testing NGEN...";      check_binary optional      NGEN      "$BIN_DIR/ngen"      --version

          # Wider optional smoke set: these ship on most platforms, so actually
          # executing them (when present) catches a broken/unrelocatable binary
          # that a mere file-existence check would miss. Absent ones are skipped.
          echo "Testing FUSE...";      check_binary optional      FUSE      "$BIN_DIR/fuse"      --help
          echo "Testing HYPE...";      check_binary optional      HYPE      "$BIN_DIR/hype"      --version
          echo "Testing MESH...";      check_binary optional      MESH      "$BIN_DIR/mesh"      --help
          echo "Testing TauDEM...";    check_binary optional      TauDEM    "$BIN_DIR/pitremove"

          echo "All critical binaries are executable"

      - name: Summary
        if: success()
        run: |
          echo "========================================="
          echo "npm Installation Test Summary"
          echo "========================================="
          echo "Platform: ${{ matrix.platform }}"
          echo "Package installed successfully"
          echo "CLI commands work"
          echo "Binaries downloaded and verified"
          echo "Critical tools are executable"

  # ===========================================================================
  # Release Summary
  # ===========================================================================
  release-summary:
    name: Release Summary
    needs: [build-and-release, publish-npm, test-npm-install]
    runs-on: ubuntu-24.04
    if: always()

    steps:
      - name: Summary
        run: |
          echo "========================================="
          echo "Release Build Summary"
          echo "========================================="
          echo "Build status: ${{ needs.build-and-release.result }}"
          echo "npm publish status: ${{ needs.publish-npm.result }}"
          echo "npm install tests: ${{ needs.test-npm-install.result }}"

          if [ "${{ needs.build-and-release.result }}" = "success" ]; then
            echo "✅ All platform builds completed successfully"
            echo ""
            echo "Release artifacts uploaded to:"

            if [ -n "${{ github.event.inputs.tag }}" ]; then
              TAG="${{ github.event.inputs.tag }}"
            elif [[ "${{ github.ref_name }}" == v* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="latest"
            fi

            echo "https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo ""
            echo "Artifacts:"
            echo "  - symfluence-tools-${TAG}-linux-x86_64.tar.gz"
            echo "  - symfluence-tools-${TAG}-macos-arm64.tar.gz"
            echo "  - symfluence-tools-${TAG}-windows-x86_64.tar.gz"
          else
            echo "❌ Release build failed"
            exit 1
          fi

          if [ "${{ needs.publish-npm.result }}" = "success" ]; then
            echo ""
            echo "📦 npm package published successfully"
            echo "   Install with: npm install -g symfluence"
          elif [ "${{ needs.publish-npm.result }}" = "skipped" ]; then
            echo ""
            echo "ℹ️  npm publish skipped (prerelease or workflow_dispatch)"
          else
            echo ""
            echo "⚠️  npm publish failed or was skipped"
          fi

          if [ "${{ needs.test-npm-install.result }}" = "success" ]; then
            echo ""
            echo "✅ npm installation tests passed on both platforms"
          elif [ "${{ needs.test-npm-install.result }}" = "skipped" ]; then
            echo ""
            echo "ℹ️  npm installation tests skipped"
          else
            echo ""
            echo "⚠️  npm installation tests failed or incomplete"
          fi
