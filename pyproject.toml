[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]

[project]
name = "symfluence"
description = "SYnergistic Modelling Framework for Linking and Unifying Earth-system Nexii for Computational Exploration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "SYMFLUENCE Team", email = "dev@symfluence.org" }]
dynamic = ["version"]

# Runtime dependencies with version constraints for stability
dependencies = [
  # Core scientific stack - constrained to major versions
  # NumPy 2.0+ required for ABI compatibility with compiled extensions
  "numpy>=2.0.0,<3.0.0",
  "pandas>=2.0.0,<3.0.0",
  "scipy>=1.10.0,<2.0.0",
  "xarray>=2023.0.0,<2026.0.0",
  "pint_xarray",
  "distributed",
  "pyviscous",
  # Geospatial - GDAL is optional; system installs (brew, apt, conda) are auto-detected
  "geopandas>=0.13.0,<2.0.0",
  "rasterio>=1.3.0,<2.0.0",
  "pyflwdir>=0.5.0,<1.0.0",
  "pyproj>=3.5.0,<4.0.0",
  "shapely>=2.0.0,<3.0.0",
  "fiona>=1.9.0,<2.0.0",
  "easymore",
  "rasterstats",
  "exactextract>=0.3.0",
  "pvlib",
  "cdo>=1.6.0,<3.0.0",
  # Visualization
  "seaborn>=0.12.0,<1.0.0",
  "plotly>=5.0.0,<6.0.0",
  "matplotlib>=3.7.0,<4.0.0",
  "contextily",
  # Cloud and data access
  "gcsfs>=2023.0.0",
  "netCDF4>=1.6.0,<2.0.0",
  "h5netcdf>=1.1.0,<2.0.0",
  "zarr>=2.18.0,<4.0.0",
  # DAP2 client for NASA Hyrax OPeNDAP endpoints (gridded Daymet). The
  # libnetcdf DAP route cannot authenticate via Earthdata sessions and the
  # Hyrax deployment rejects plain DAP4 constraints, so pydap is required.
  "pydap>=3.4.0,<4.0.0",
  # cdsapi 0.7.0 is the first release that speaks the post-September-2024
  # CDS endpoint (https://cds.climate.copernicus.eu/api, no /v2). Pinning
  # below 0.7.0 lets pip resolve an older package that silently 404s on
  # every CDS download and triggers the ARCO fallback with a misleading
  # error. Lower bound is strict for this reason.
  "cdsapi>=0.7.0,<1.0.0",
  "s3fs>=2023.0.0",
  "cftime>=1.6.0,<2.0.0",
  # Hydrology specific
  "hydrobm",
  # Utilities
  "psutil>=5.9.0,<6.0.0",
  "tqdm>=4.64.0,<5.0.0",
  "pyyaml>=6.0.0,<7.0.0",
  "requests>=2.28.0,<3.0.0",
  "numexpr>=2.8.0,<3.0.0",
  "bottleneck>=1.3.0,<2.0.0",
  "networkx>=3.0.0,<4.0.0",
  # CLI
  "rich>=13.0.0,<14.0.0",
  # Configuration models
  "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
# Global sensitivity methods (Sobol and RBD-FAST). Correlation and VISCOUS
# sensitivity analysis remain available from the default installation.
#   pip install "symfluence[sensitivity]"
sensitivity = [
  "SALib>=1.4.0,<2.0.0",
]
# CONUS404 access through the HyTEST Intake catalog. Intake 2.0.9 currently
# has an unfixed advisory, so it is isolated from the default installation.
conus404 = [
  "intake-xarray",
]
# PyTorch-based features: LSTM and GNN models, and the dCoupler differentiable
# coupling framework. Optional: a plain install stays ~1 GB lighter; the LSTM/
# GNN plugins and dCoupler graph coupling activate when this extra is present.
#   pip install "symfluence[ml]"
ml = [
  "torch>=2.0.0,<3.0.0",
  "scikit-learn>=1.2.0,<2.0.0",
  "dcoupler>=0.2.0",
]
# JAX-based model plugins (Snow-17, SAC-SMA, Xinanjiang, HBV, HEC-HMS, TOPMODEL).
# Optional: only needed to run those models, discovered via entry points at runtime.
#   pip install "symfluence[jax]"
# Floors require the *PostProcessor-spelling plugin releases (the old
# *Postprocessor base-class aliases were removed pre-1.0, RTI item 23).
jax = [
  # jax itself: the plugin packages keep it optional (NumPy fallback), but the
  # differentiable-calibration experiments (ADAM/L-BFGS, autodiff) require it.
  "jax>=0.4.26",
  "jsnow17>=0.1.0",
  "jsacsma>=0.2.4",
  "jxaj>=0.2.3",
  "jhbv>=0.2.4",
  "jhechms>=0.2.3",
  "jtopmodel>=0.2.3",
]
# dRoute differentiable river routing plugin (C++ engine + SYMFLUENCE integration).
# Optional: only needed to run dRoute routing/calibration, discovered via entry points at runtime.
#   pip install "symfluence[droute]"
droute = [
  "droute>=0.6.1",
]
# GDAL Python bindings - optional, system GDAL installs are auto-detected.
# Only needed for DEM slope/aspect generation and GeoTIFF metadata reading.
# Install via: uv pip install "symfluence[gdal]", or rely on system install
# (brew install gdal, apt install python3-gdal, conda install gdal).
gdal = [
  "gdal>=3.6.0,<4.0.0",
]
# MESH model support - requires packages not on PyPI (hydrant on PyPI is an
# unrelated Kinesis Firehose tool; the correct one is kasra-keshavarz/hydrant).
# hydrant MUST be installed before meshflow to prevent pip resolving to the wrong package.
# Install manually:
#   uv pip install git+https://github.com/kasra-keshavarz/hydrant.git
#   uv pip install git+https://github.com/CH-Earth/meshflow.git@main
# R integration (requires R and libgcc to be installed)
r = [
  "rpy2>=3.5.0,<4.0.0",
]
# Climate classification attributes (Koppen-Geiger, Holdridge, Thornthwaite).
# Pulls the standalone `climaclass` package from PyPI; its bundled SYMFLUENCE
# attribute-processor plugin is discovered automatically via the
# `symfluence.attribute_processors` entry point during acquire_attributes.
# Install via: uv pip install "symfluence[climate-classification]"
climate-classification = [
  "climaclass[symfluence]>=0.3.0",
]
# Community data services (standalone packages by the SYMFLUENCE authors).
# Each ships a SYMFLUENCE plugin discovered via the `symfluence.plugins`
# entry point — no framework wiring beyond installing the package:
#   cfs  — forcing acquisition  (FORCING_DATASET: CFS + CFS_PRODUCT: ...)
#   cas  — zonal attributes     (CAS_DATASETS: ... in any attribute profile)
#   csfs — streamflow obs       (ADDITIONAL_OBSERVATIONS: csfs + CSFS_STATION_ID: ...)
# Install via: uv pip install "symfluence[community]" (or cfs/cas/csfs singly)
# The services release independently — no upper cap, the resolver selects
# each newest release. Compatibility is enforced at registration time by the
# contract's is_compatible guard (data/backends/contract.py): a service
# targeting a newer contract minor than this framework ships is cleanly
# declined, never silently claimed compatible. Each floor is the newest
# PUBLISHED release line for that service (they lag the in-tree contract
# unevenly); raise a floor when its service publishes a newer surface.
cfs = [
  "community-forcing-service>=0.6.0",
]
cas = [
  "community-attribute-service>=0.4.0",
]
csfs = [
  "community-streamflow-service>=0.4.0",
]
community = [
  "community-forcing-service>=0.6.0",
  "community-attribute-service>=0.4.0",
  "community-streamflow-service>=0.4.0",
]
# Development tools
dev = [
  "ruff>=0.1.0",
  "mypy>=1.0.0",
  "pre-commit>=3.0.0",
]
# Testing dependencies
test = [
  "pytest>=7.0.0,<10.0.0",
  "pytest-xdist>=3.0.0",
  "pytest-cov>=4.0.0",
  "pytest-timeout>=2.0.0",
  "hypothesis>=6.0.0,<7.0.0",
  # Independent optimizer implementation used as an external reference in
  # tests/integration/optimization/test_optimizer_external_reference.py
  # (SCE-UA cross-check).
  "spotpy>=1.5.0",
  # The test suite imports the JAX plugins and the torch-based LSTM/GNN/
  # coupling stack, so the full test extra pulls in those optional groups
  # (the baseline install does not).
  "symfluence[jax]",
  "symfluence[ml]",
  "symfluence[sensitivity]",
]
# Documentation tools
docs = [
  "sphinx>=7.0.0",
  "pydata-sphinx-theme>=0.15.0",
  "sphinx-design>=0.5.0",
  "myst-parser>=2.0.0",
]
# Interactive development
notebook = [
  "jupyterlab>=4.0.0,<5.0.0",
  "ipykernel>=6.20.0,<7.0.0",
]
# Panel-based web GUI
gui = [
  "panel>=1.3.0,<2.0.0",
  "bokeh>=3.3.0,<4.0.0",
]
# Textual-based terminal UI
tui = [
  "textual>=0.47.0,<1.0.0",
]
# ALOS DEM via Microsoft Planetary Computer
alos = [
  "planetary-computer>=1.0.0",
  "pystac-client>=0.7.0",
]
# HPC / distributed parallelism (mpi4py must be built against the site MPI;
# on many HPC systems `module load py-mpi4py` is preferred over pip install)
hpc = [
  "mpi4py>=3.0.0,<4.0.0",
]
# Complete supported development environment. Platform/system integrations
# (GDAL, MPI/HPC, dRoute) and independently released community services remain
# explicit opt-ins because they need external libraries or release separately.
dev-all = [
  "symfluence[r,dev,test,docs,notebook,gui,tui,alos]",
]

[project.scripts]
# thin wrapper that delegates to your existing CLI
symfluence = "symfluence.main_cli:main"

# ---------------------------------------------------------------------------
# Plugin entry points
# ---------------------------------------------------------------------------
# External packages register symfluence plugins here.  Each entry point
# should reference a zero-arg callable that performs registrations using
# R.*.add(), model_manifest(), or any other registry API.
#
# The six bundled JAX model packages (jhbv, jhechms, jtopmodel, jsnow17,
# jsacsma, jxaj) each declare their own entry points in their respective
# pyproject.toml files — they are discovered automatically at runtime
# via importlib.metadata and do not need to be repeated here.
#
# To add a new external model plugin, declare in your package's pyproject.toml:
#
#   [project.entry-points."symfluence.plugins"]
#   my_model = "my_package:register"
#
# In-tree models dogfood this same path: each ships a zero-arg register() in its
# models/<name>/__init__.py, declared below.  They are also loaded by a
# deterministic fallback loop in symfluence/models/__init__.py (idempotent), so
# they never silently vanish from stale dist metadata.  This list must stay in
# sync with symfluence.models.IN_TREE_MODELS — enforced by
# tests/unit/models/test_entry_point_dogfood.py.
[project.entry-points."symfluence.plugins"]
symfluence_summa = "symfluence.models.summa:register"
symfluence_fuse = "symfluence.models.fuse:register"
symfluence_ngen = "symfluence.models.ngen:register"
symfluence_mizuroute = "symfluence.models.mizuroute:register"
symfluence_troute = "symfluence.models.troute:register"
symfluence_hype = "symfluence.models.hype:register"
symfluence_mesh = "symfluence.models.mesh:register"
symfluence_lstm = "symfluence.models.lstm:register"
symfluence_gr = "symfluence.models.gr:register"
symfluence_gnn = "symfluence.models.gnn:register"
symfluence_rhessys = "symfluence.models.rhessys:register"
symfluence_ignacio = "symfluence.models.ignacio:register"
symfluence_vic = "symfluence.models.vic:register"
symfluence_clm = "symfluence.models.clm:register"
symfluence_modflow = "symfluence.models.modflow:register"
symfluence_parflow = "symfluence.models.parflow:register"
symfluence_clmparflow = "symfluence.models.clmparflow:register"
symfluence_swat = "symfluence.models.swat:register"
symfluence_mhm = "symfluence.models.mhm:register"
symfluence_crhm = "symfluence.models.crhm:register"
symfluence_wrfhydro = "symfluence.models.wrfhydro:register"
symfluence_prms = "symfluence.models.prms:register"
symfluence_pihm = "symfluence.models.pihm:register"
symfluence_wmfire = "symfluence.models.wmfire:register"
symfluence_gsflow = "symfluence.models.gsflow:register"
symfluence_watflood = "symfluence.models.watflood:register"
symfluence_raven = "symfluence.models.raven:register"
symfluence_wflow = "symfluence.models.wflow:register"
symfluence_lisflood = "symfluence.models.lisflood:register"
symfluence_pcrglobwb = "symfluence.models.pcrglobwb:register"
symfluence_cwatm = "symfluence.models.cwatm:register"
symfluence_noahmp = "symfluence.models.noahmp:register"

[project.urls]
Homepage = "https://symfluence.org"
Source = "https://github.com/symfluence-org/SYMFLUENCE"
Issues = "https://github.com/symfluence-org/SYMFLUENCE/issues"
Documentation = "https://symfluence.readthedocs.io"

[tool.hatch.build.targets.sdist]
include = [
  "src/symfluence",
  "README.md",
  "LICENSE",
  "MANIFEST.in",
  "examples/"
]
exclude = [
  "/.*",
  "/venv/",
  "/repro_runs_native/",
  "/domain_*/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/symfluence"]

# NOTE: pytest configuration is in pytest.ini (authoritative source)
# This avoids duplication and ensures consistent test configuration

[tool.hatch.version]
path = "src/symfluence/symfluence_version.py"

# Linux and Windows CI/development use PyTorch's CPU wheels. macOS uses PyPI,
# where the native wheel does not carry the Linux CUDA dependency stack.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[tool.ruff]
# Target Python 3.11
target-version = "py311"

# Line length to match common conventions
line-length = 120

# Exclude common non-source directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "examples",  # Notebooks can be informal
]

[tool.ruff.lint]
# Select rules to enforce
select = [
    "F",      # Pyflakes (undefined names, unused imports, etc.)
    "W",      # pycodestyle warnings (trailing whitespace, etc.)
    "I",      # isort (import ordering)
    "B",      # flake8-bugbear (common bug patterns)
    "PGH003", # Blanket type: ignore without error code
    "BLE001", # No blind except Exception
]

# Ignore rules that are intentional patterns
ignore = [
    # F401 (unused imports) remains enforced globally.
    # Exceptions are limited via per-file ignores below.
    "F403",  # Star imports - intentional for re-exports in __init__.py
    "F405",  # Name may be undefined from star import - related to F403
    "E701",  # Multiple statements on one line (colon) - common guard clause pattern
    "E402",  # Module level import not at top - intentional for optional deps/deprecation
    # Bugbear rules deferred — high count, low value for paper release
    "B905",  # zip-without-strict (stylistic)
    "B007",  # Unused loop variable (cosmetic)
    "B028",  # No explicit stacklevel in warnings (cosmetic)
    "B017",  # assert-raises-exception in tests (test-only)
    "B027",  # Empty method without abstract decorator (intentional base classes)
    "B024",  # Abstract base class without abstract method (intentional)
]

[tool.ruff.lint.isort]
known-first-party = ["symfluence", "test_helpers"]
# Enforce PEP 563 lazy annotations tree-wide (RTI review open question 10).
# I002 adds this to every new module automatically; docstring-only modules are
# exempted by ruff (nothing to annotate).
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# Tests can have more relaxed rules for imports and unused variables
"tests/**/*.py" = ["F401", "F841"]
# Init files often have unused imports for re-export
"**/__init__.py" = ["F401", "F403"]

[tool.bandit]
exclude_dirs = ["tests", "examples", "venv", ".venv"]
skips = [
    "B101",  # Allow assert statements
    "B110",  # try_except_pass - used for optional error handling
    "B112",  # try_except_continue - used for optional error handling in loops
    "B311",  # random - not used for security/cryptographic purposes
    "B404",  # subprocess import - required for external model execution
    "B603",  # subprocess calls - required for external model execution
    "B607",  # partial paths - safe for known system commands
]

[tool.mypy]
python_version = "3.11"
show_error_codes = true
warn_return_any = false
warn_redundant_casts = true
strict_equality = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = false
# Ignore the most common noisy errors for now
# These high-volume categories are being enabled incrementally.  Do not add
# codes here without recording a concrete burn-down plan.
disable_error_code = ["attr-defined", "operator", "arg-type", "assignment", "union-attr"]
exclude = ["examples/", "tests/", "src/symfluence/cli\\.py$"]

[tool.coverage.run]
source = ["src/symfluence"]
branch = true
relative_files = true
disable_warnings = ["couldnt-parse", "no-data-collected"]
omit = [
    "src/symfluence/gui/*",
    "src/symfluence/tui/*",
    "src/symfluence/*/build_instructions.py",
    "src/symfluence/fews/*",
]

[tool.coverage.report]
# Avoid failing release checks when local/stale coverage databases
# reference files that no longer exist after refactors/moves.
ignore_errors = true
# Actual coverage ~29% (unit tests only, with pytest-xdist parallel).
# Many modules require external model binaries, live APIs, or real
# forcing data that cannot run in CI. The floor is a one-way ratchet:
# raise it as coverage improves, never lower it (see docs/adr/0008-*).
fail_under = 25
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "pass",
    "@(abc\\.)?abstractmethod",
]
